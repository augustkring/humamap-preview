<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HumaMap — Copy alignment v34</title>
  <style>html,body{margin:0;background:#FCFCFA}</style>
</head>
<body>
  <iframe id="base" src="../top-v33/index.html" title="" style="position:fixed;inset:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('base');

      const fixes = `
        /*
          Copy alignment rule:
          copy stays safely inside the content grid;
          only graphics are allowed to bleed into the outer margin.
        */
        .team-layout,
        .company-layout{
          grid-template-columns:476px minmax(0,1fr)!important;
          gap:30px!important;
          width:100%!important;
        }

        .team-copy,
        .company-copy{
          width:390px!important;
          max-width:390px!important;
          margin-left:46px!important;
          margin-right:0!important;
          padding-left:0!important;
          padding-right:0!important;
          justify-self:start!important;
          box-sizing:border-box!important;
        }

        .team-stage,
        .company-stage{
          width:650px!important;
          justify-self:end!important;
          margin-left:0!important;
          margin-right:-42px!important;
        }

        .team-stage{
          transform:scale(.92)!important;
          transform-origin:right center!important;
        }

        /* Keep the proof-to-company transition compact. */
        .proof-section{padding-bottom:54px!important}
        .company-section{padding-top:24px!important}

        @media(max-width:1120px){
          .team-layout,
          .company-layout{
            grid-template-columns:430px minmax(0,1fr)!important;
            gap:28px!important;
          }

          .team-copy,
          .company-copy{
            width:370px!important;
            max-width:370px!important;
            margin-left:28px!important;
          }

          .team-stage,
          .company-stage{
            margin-right:-24px!important;
          }
        }

        @media(max-width:980px){
          .team-layout,
          .company-layout{
            grid-template-columns:1fr!important;
            gap:48px!important;
          }

          .team-copy,
          .company-copy{
            width:auto!important;
            max-width:680px!important;
            margin-left:0!important;
            justify-self:start!important;
          }

          .team-stage,
          .company-stage{
            width:650px!important;
            max-width:100%!important;
            margin-left:auto!important;
            margin-right:auto!important;
            justify-self:center!important;
            transform:none!important;
          }

          .proof-section{padding-bottom:64px!important}
          .company-section{padding-top:30px!important}
        }

        @media(max-width:680px){
          .team-copy,
          .company-copy{
            width:100%!important;
            max-width:100%!important;
            margin-left:0!important;
          }

          .team-stage,
          .company-stage{
            width:650px!important;
            margin-left:0!important;
            margin-right:0!important;
            justify-self:start!important;
            transform:scale(.76)!important;
            transform-origin:top left!important;
          }
        }
      `;

      const render = () => {
        try {
          const doc = frame.contentDocument;
          if (!doc || !doc.querySelector('.leadership-section') || !doc.querySelector('.team-section') || !doc.querySelector('.company-section')) return false;

          const style = doc.createElement('style');
          style.textContent = fixes;
          doc.head.appendChild(style);

          const clone = doc.documentElement.cloneNode(true);
          clone.querySelectorAll('script').forEach(script => script.remove());
          clone.querySelectorAll('#base').forEach(node => node.remove());

          document.open();
          document.write('<!doctype html>' + clone.outerHTML);
          document.close();
          return true;
        } catch (e) {
          return false;
        }
      };

      const timer = setInterval(() => {
        if (render()) clearInterval(timer);
      }, 120);

      setTimeout(() => clearInterval(timer), 12000);
    })();
  </script>
</body>
</html>
