<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HumaMap — Grid alignment v33</title>
  <style>html,body{margin:0;background:#FCFCFA}</style>
</head>
<body>
  <iframe id="base" src="../top-v32/index.html" title="" style="position:fixed;inset:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('base');

      const fixes = `
        /* One content grid for all copy. Only product graphics may bleed into margins. */
        .team-layout,
        .company-layout{grid-template-columns:430px minmax(0,1fr)!important;gap:76px!important}

        .team-copy,
        .company-copy{max-width:420px!important;margin-left:0!important;padding-left:0!important;justify-self:start!important}

        .team-stage,
        .company-stage{width:650px!important;justify-self:end!important;margin-right:-36px!important}

        .team-stage{transform:scale(.92)!important;transform-origin:right center!important}

        /* Business Impact should read as a short proof break, not create another full section gap. */
        .proof-section{padding-bottom:64px!important}
        .company-section{padding-top:32px!important}

        @media(max-width:1120px){
          .team-layout,.company-layout{grid-template-columns:400px minmax(0,1fr)!important;gap:52px!important}
          .team-copy,.company-copy{max-width:390px!important;margin-left:0!important}
          .team-stage,.company-stage{margin-right:-24px!important}
        }

        @media(max-width:980px){
          .team-layout,.company-layout{grid-template-columns:1fr!important;gap:48px!important}
          .team-copy,.company-copy{max-width:680px!important;margin-left:0!important;justify-self:start!important}
          .team-stage,.company-stage{width:650px!important;max-width:100%!important;margin-left:auto!important;margin-right:auto!important;justify-self:center!important;transform:none!important}
          .proof-section{padding-bottom:72px!important}
          .company-section{padding-top:36px!important}
        }

        @media(max-width:680px){
          .team-copy,.company-copy{max-width:100%!important}
          .team-stage,.company-stage{width:650px!important;margin-left:0!important;margin-right:0!important;justify-self:start!important;transform:scale(.76)!important;transform-origin:top left!important}
          .proof-section{padding-bottom:58px!important}
          .company-section{padding-top:28px!important}
        }
      `;

      const render = () => {
        try {
          const doc = frame.contentDocument;
          if (!doc || !doc.querySelector('.leadership-section') || !doc.querySelector('.team-section') || !doc.querySelector('.company-section')) return false;

          const style = doc.createElement('style');
          style.textContent = fixes;
          doc.head.appendChild(style);

          const clone = doc.documentElement.cloneNode(true);
          clone.querySelectorAll('script').forEach(script => script.remove());
          clone.querySelectorAll('#base').forEach(node => node.remove());

          document.open();
          document.write('<!doctype html>' + clone.outerHTML);
          document.close();
          return true;
        } catch (e) {
          return false;
        }
      };

      const timer = setInterval(() => {
        if (render()) clearInterval(timer);
      }, 120);

      setTimeout(() => clearInterval(timer), 12000);
    })();
  </script>
</body>
</html>
