<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HumaMap — Homepage Top + Compare + Team v22</title>
</head>
<body>
<script>
(async () => {
  const response = await fetch('../top-v17/index.html');
  let html = await response.text();

  html = html
    .replace('<title>HumaMap — Homepage Top + Compare v17</title>', '<title>HumaMap — Homepage Top + Compare + Team v22</title>')
    .replace('.person-stage{padding-top:0;padding-bottom:124px}', '.person-stage{padding-top:0;padding-bottom:95px}')
    .replace('.compare-section{padding:108px 0 172px}', '.compare-section{padding:83px 0 172px}')
    .replace('.compare-ai p{margin:8px 0 0;color:var(--text);font-size:16px;line-height:1.52;letter-spacing:-.004em}', '.compare-ai p{margin:8px 0 0;color:var(--text);font-size:16px;line-height:1.52;letter-spacing:-.004em}.compare-cta{display:inline-flex;margin-top:27px;text-decoration:none;font-size:15px;line-height:1.4;font-weight:600;letter-spacing:-.008em}')
    .replace('<div class="compare-ai" aria-label="HumaMap AI for understanding others">\n            <span class="ai-title">HumaMap AI</span>\n            <p>An AI that understands both HumaMaps can help you understand another person and explore how you may work together.</p>\n          </div>', '<div class="compare-ai" aria-label="HumaMap AI for understanding others">\n            <span class="ai-title">HumaMap AI</span>\n            <p>An AI that understands both HumaMaps can help you understand another person and explore how you may work together.</p>\n          </div>\n          <a class="compare-cta" href="#">Create your own free profile →</a>');

  const teamStyles = `
    /* Team section */
    .team-section{padding:96px 0 180px}
    .team-layout{display:grid;grid-template-columns:430px minmax(0,1fr);gap:88px;align-items:center}
    .team-copy{max-width:430px}
    .team-copy h2{margin:0;font-size:48px;line-height:1.075;letter-spacing:-.034em;font-weight:550}
    .team-copy>p{margin:26px 0 0;color:var(--muted);font-size:18px;line-height:1.56;letter-spacing:-.006em}
    .team-audiences{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:32px}
    .team-audiences strong{display:block;font-size:13.5px;line-height:1.35;font-weight:650;color:var(--text)}
    .team-audiences p{margin:7px 0 0;color:var(--muted);font-size:14px;line-height:1.48}
    .team-ai{max-width:405px;margin-top:38px}
    .team-ai .ai-title{font-size:18px}
    .team-ai p{margin:8px 0 0;color:var(--text);font-size:16px;line-height:1.52;letter-spacing:-.004em}

    .team-stage{position:relative;height:680px}
    .team-person-card{position:absolute;width:245px;height:342px;padding:22px 21px;border-radius:23px;background:#fff;overflow:hidden;box-shadow:0 18px 44px rgba(21,21,21,.06);z-index:1}
    .team-person-card.p1{left:6px;top:112px;transform:rotate(-7deg)}
    .team-person-card.p2{left:82px;top:48px;transform:rotate(-3deg)}
    .team-person-card.p3{right:82px;top:46px;transform:rotate(3deg)}
    .team-person-card.p4{right:6px;top:112px;transform:rotate(7deg)}
    .team-person-head{display:flex;align-items:center;gap:12px}
    .team-person-avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;overflow:hidden;flex:0 0 auto;background:#EDF3F0;color:var(--green);font-size:13px;font-weight:650}
    .team-person-avatar img{width:100%;height:100%;object-fit:cover;object-position:center 24%}
    .team-person-head strong{display:block;font-size:15px;line-height:1.2;letter-spacing:-.02em}
    .team-person-head span{display:block;margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.35}
    .team-person-label{display:block;margin-top:23px;color:var(--green);font-size:9px;line-height:1.2;font-weight:650;letter-spacing:.08em;text-transform:uppercase}
    .team-person-ghosts{display:grid;gap:7px;margin-top:10px}
    .team-person-ghost{height:3px;border-radius:999px;background:rgba(21,21,21,.06)}
    .team-person-ghost:nth-child(1){width:88%}
    .team-person-ghost:nth-child(2){width:65%}
    .team-person-ghost:nth-child(3){width:78%;margin-top:16px}
    .team-person-ghost:nth-child(4){width:52%}

    .team-card{position:absolute;left:92px;top:138px;width:470px;padding:29px 30px 28px;border-radius:25px;background:#fff;box-shadow:0 32px 76px rgba(21,21,21,.115),0 8px 22px rgba(21,21,21,.035);transform:rotate(.35deg);z-index:4}
    .team-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
    .team-card-kicker{display:block;color:var(--green);font-size:11.5px;line-height:1.3;font-weight:650}
    .team-card h3{margin:6px 0 0;font-size:25px;line-height:1.12;letter-spacing:-.028em;font-weight:600}
    .team-members{display:flex;align-items:center;padding-top:2px}
    .team-member-dot{width:36px;height:36px;margin-left:-8px;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#EDF3F0;color:var(--green);font-size:10px;font-weight:650}
    .team-member-dot:first-child{margin-left:0}
    .team-member-dot img{width:100%;height:100%;object-fit:cover;object-position:center 24%}

    .team-primary{margin-top:24px;padding:20px 21px 21px;border-radius:14px;background:#F1F5F2}
    .team-insight-label{display:block;color:var(--green);font-size:11.5px;line-height:1.3;font-weight:650}
    .team-primary p{margin:8px 0 0;font-size:15px;line-height:1.48;letter-spacing:-.005em}
    .team-insights{margin-top:22px}
    .team-insight{display:grid;grid-template-columns:126px 1fr;gap:18px;padding:15px 0;border-top:1px solid rgba(21,21,21,.07)}
    .team-insight:first-child{border-top:0;padding-top:0}
    .team-insight strong{font-size:11px;line-height:1.4;font-weight:650;color:#555550}
    .team-insight p{margin:0;color:#343431;font-size:13.5px;line-height:1.46}
    .team-depth{margin-top:21px;padding-top:18px;border-top:1px solid rgba(21,21,21,.07)}
    .team-depth-caption{display:block;color:#8A8A85;font-size:10px;line-height:1.3;font-weight:600}
    .team-depth-row{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;margin-top:12px}
    .team-depth-row span{color:#6E6E69;font-size:10.5px;line-height:1.3;font-weight:600}
    .team-depth-lines{display:grid;gap:5px}
    .team-depth-line{height:3px;border-radius:999px;background:rgba(21,21,21,.06)}
    .team-depth-line:nth-child(1){width:80%}
    .team-depth-line:nth-child(2){width:58%}

    @media(max-width:1120px){
      .team-layout{grid-template-columns:400px minmax(0,1fr);gap:50px}
      .team-stage{transform:scale(.92);transform-origin:right center}
    }
    @media(max-width:980px){
      .team-section{padding-top:72px}
      .team-layout{grid-template-columns:1fr;gap:48px}
      .team-copy{max-width:680px}
      .team-stage{width:650px;max-width:100%;transform:none;margin-left:auto;margin-right:auto}
      .team-copy h2{font-size:44px}
    }
    @media(max-width:680px){
      .team-section{padding:54px 0 100px;overflow:hidden}
      .team-copy h2{font-size:38px}
      .team-copy>p{font-size:17px;margin-top:21px}
      .team-audiences{grid-template-columns:1fr;gap:20px;margin-top:28px}
      .team-ai{margin-top:31px}
      .team-ai .ai-title{font-size:17px}
      .team-ai p{font-size:15px}
      .team-stage{width:650px;height:650px;transform:scale(.76);transform-origin:top left}
    }
  `;

  html = html.replace('</style>', teamStyles + '\n  </style>');

  const teamSection = `
    <section class="team-section shell" aria-label="HumaMap Teams">
      <div class="team-layout">
        <div class="team-copy">
          <h2>Understand the team, not just the individuals.</h2>
          <p>HumaMap helps everyone in a team understand the people they work with, while giving managers a clearer view of how the team works as a whole.</p>

          <div class="team-audiences">
            <div>
              <strong>For everyone</strong>
              <p>Understand the people you work with and how you work together.</p>
            </div>
            <div>
              <strong>For managers</strong>
              <p>See complementarity, friction, gaps and what the team may need.</p>
            </div>
          </div>

          <div class="team-ai" aria-label="HumaMap AI for teams">
            <span class="ai-title">HumaMap AI</span>
            <p>Explore where a team complements each other, where friction may arise and what may be missing.</p>
          </div>
        </div>

        <div class="team-stage" aria-label="Example Product Team HumaMap">
          <article class="team-person-card p1" aria-hidden="true">
            <div class="team-person-head"><div class="team-person-avatar"><img src="https://raw.githubusercontent.com/augustkring/augustkring.github.io/main/assets/august_profile.jpg" alt="" /></div><div><strong>August</strong><span>Founder</span></div></div>
            <span class="team-person-label">My strengths</span><div class="team-person-ghosts"><div class="team-person-ghost"></div><div class="team-person-ghost"></div><div class="team-person-ghost"></div><div class="team-person-ghost"></div></div>
          </article>
          <article class="team-person-card p2" aria-hidden="true">
            <div class="team-person-head"><div class="team-person-avatar">S</div><div><strong>Sofia</strong><span>Engineering</span></div></div>
            <span class="team-person-label">How I work</span><div class="team-person-ghosts"><div class="team-person-ghost"></div><div class="team-person-ghost"></div><div class="team-person-ghost"></div><div class="team-person-ghost"></div></div>
          </article>
          <article class="team-person-card p3" aria-hidden="true">
            <div class="team-person-head"><div class="team-person-avatar">M</div><div><strong>Martin</strong><span>Product</span></div></div>
            <span class="team-person-label">What drives me</span><div class="team-person-ghosts"><div class="team-person-ghost"></div><div class="team-person-ghost"></div><div class="team-person-ghost"></div><div class="team-person-ghost"></div></div>
          </article>
          <article class="team-person-card p4" aria-hidden="true">
            <div class="team-person-head"><div class="team-person-avatar">E</div><div><strong>Emma</strong><span>Design</span></div></div>
            <span class="team-person-label">Working with me</span><div class="team-person-ghosts"><div class="team-person-ghost"></div><div class="team-person-ghost"></div><div class="team-person-ghost"></div><div class="team-person-ghost"></div></div>
          </article>

          <article class="team-card">
            <header class="team-card-head">
              <div><span class="team-card-kicker">Team HumaMap</span><h3>Product Team</h3></div>
              <div class="team-members" aria-label="August, Sofia, Martin and Emma">
                <div class="team-member-dot"><img src="https://raw.githubusercontent.com/augustkring/augustkring.github.io/main/assets/august_profile.jpg" alt="August" /></div>
                <div class="team-member-dot">S</div><div class="team-member-dot">M</div><div class="team-member-dot">E</div>
              </div>
            </header>

            <section class="team-primary">
              <span class="team-insight-label">Where this team complements each other</span>
              <p>The team combines pace and momentum with deeper validation, structured execution and strong attention to the user experience.</p>
            </section>

            <div class="team-insights">
              <div class="team-insight"><strong>Potential friction</strong><p>Different decision speeds may create tension when ownership is unclear.</p></div>
              <div class="team-insight"><strong>What may be missing</strong><p>Less natural preference for detailed follow-through once direction is set.</p></div>
              <div class="team-insight"><strong>Pay attention to</strong><p>Make responsibilities explicit when the team is moving quickly.</p></div>
            </div>

            <div class="team-depth" aria-hidden="true">
              <span class="team-depth-caption">More in the team view</span>
              <div class="team-depth-row"><span>Similarities</span><div class="team-depth-lines"><div class="team-depth-line"></div><div class="team-depth-line"></div></div></div>
              <div class="team-depth-row"><span>Decision making</span><div class="team-depth-lines"><div class="team-depth-line"></div><div class="team-depth-line"></div></div></div>
            </div>
          </article>
        </div>
      </div>
    </section>
  `;

  html = html.replace('</main>', teamSection + '\n  </main>');

  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
