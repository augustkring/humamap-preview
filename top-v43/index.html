      const styles = `
        /* Real HumaMap symbol in Company profile */
        .company-mark{background:transparent!important;border-radius:0!important;overflow:visible!important;padding:0!important}
        .company-mark-logo{display:block;width:52px;height:52px;object-fit:contain}

        /* Keep Leadership and final CTA clean. No decorative green fields here. */
        .lead40-artifacts::before{display:none!important}
        .final-cta-section::before,.final-cta-section::after{display:none!important}
      `;

      const render = () => {
        try {
          const doc = frame.contentDocument;
          const companyMark = doc && doc.querySelector('.company-mark');
          const leadership = doc && doc.querySelector('.lead40');
          const finalCta = doc && doc.querySelector('.final-cta-section');
          if (!doc || !companyMark || !leadership || !finalCta) return false;

          const style = doc.createElement('style');
          style.textContent = styles;
          doc.head.appendChild(style);

          companyMark.innerHTML = '';
          const logo = doc.createElement('img');
          logo.className = 'company-mark-logo';
          logo.src = logoData;
          logo.alt = 'HumaMap';
          companyMark.appendChild(logo);

          const clone = doc.documentElement.cloneNode(true);
          clone.querySelectorAll('script').forEach(script => script.remove());
          clone.querySelectorAll('#base').forEach(node => node.remove());

          document.open();
          document.write('<!doctype html>' + clone.outerHTML);
          document.close();
          return true;
        } catch (e) {
          return false;
        }
      };

      const timer = setInterval(() => {
        if (render()) clearInterval(timer);
      }, 120);
      setTimeout(() => clearInterval(timer), 12000);
    })();
