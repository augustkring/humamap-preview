name: Bake Waymaking Brush Art

on:
  push:
    branches:
      - design/waymaking-ink-story-20261020
    paths:
      - "augustkring/generate-waymaking-artwork.py"
      - ".github/workflows/bake-waymaking-artwork.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout artwork source
        uses: actions/checkout@v4
      - name: Set up reproducible Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image production dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.3.5" "pillow==12.3.0" "opencv-python-headless==4.13.0.90"
      - name: Render both static ink artworks
        run: python augustkring/generate-waymaking-artwork.py
      - name: Verify rendered assets
        shell: bash
        run: |
          set -euo pipefail
          for name in waymaking-ink-road-brush.png waymaking-ink-road-brush-mobile.png; do
            test "$(xxd -p -l 8 "augustkring/assets/$name")" = "89504e470d0a1a0a"
            test "$(wc -c < "augustkring/assets/$name")" -gt 100000
          done
      - name: Commit release artwork to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add augustkring/assets/waymaking-ink-road-brush.png augustkring/assets/waymaking-ink-road-brush-mobile.png
          if ! git diff --cached --quiet; then
            git commit -m "Bake licensed high-resolution Waymaking ink road artwork"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Release artwork already matches the generator."
          fi
