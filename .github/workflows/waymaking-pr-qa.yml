name: Waymaking PR browser QA

on:
  pull_request:
    paths:
      - "augustkring/**"
      - ".github/workflows/waymaking-pr-qa.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Verify protected sections and approved text
        run: node augustkring/verify-baseline.mjs
      - name: Check real Chrome rendering
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ak-local/humamap-preview artifacts
          cp -R augustkring /tmp/ak-local/humamap-preview/augustkring
          python3 -m http.server 8765 --directory /tmp/ak-local >/tmp/ak-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/humamap-preview/augustkring/ >/dev/null; then break; fi
            sleep 1
          done
          npm install --prefix /tmp/ak-browser-check --no-audit --no-fund --silent playwright-core@1.55.0
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          CHROME_BIN="$chrome" NODE_PATH=/tmp/ak-browser-check/node_modules node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright-core');
          const widths=[320,390,768,1440];
          const names=['Creative Thinking','Commercial Understanding','Strategic Judgment','AI-Native Building','Purpose Driven'];
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox']});
            try{
              for(const width of widths){
                const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1});
                await page.goto('http://127.0.0.1:8765/humamap-preview/augustkring/',{waitUntil:'networkidle'});
                await page.evaluate(()=>document.fonts.ready);
                const art=page.locator('.waymaking-road-art img');
                await art.evaluate(img=>img.decode());
                await page.locator('.waymaking-beat').first().scrollIntoViewIfNeeded();
                await page.waitForTimeout(170);
                const audit=await page.evaluate(()=>{
                  const $=s=>document.querySelector(s);
                  const rect=x=>{const r=x.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,width:r.width,height:r.height}};
                  const beatNames=[...document.querySelectorAll('.waymaking-beat h4')].map(x=>x.textContent.trim());
                  const sizes=[...document.querySelectorAll('.waymaking-beat h4')].map(x=>parseFloat(getComputedStyle(x).fontSize));
                  return {
                    overflow:document.documentElement.scrollWidth>innerWidth+1,
                    beatNames,sizes,
                    road:rect($('.waymaking-road-wrap')),
                    artSpace:rect($('.waymaking-artspace')),
                    artOpacity:getComputedStyle($('.waymaking-road-art')).opacity,
                    artVisibility:getComputedStyle($('.waymaking-road-art')).visibility,
                    maskSvgDisplay:getComputedStyle($('.waymaking-paint-art')).display,
                    pathOffset:Number($('[data-waymaking-paint-path]').getAttribute('stroke-dashoffset')),
                    maskedSrc:$('.waymaking-paint-art image').getAttribute('href'),
                    roadPosition:getComputedStyle($('.waymaking-road-wrap')).position,
                    storyTopBorder:getComputedStyle($('.waymaking-narrative')).borderTopWidth,
                    storyBottomBorder:getComputedStyle($('.waymaking-resolution')).borderTopWidth,
                    active:!!$('.waymaking-narrative[data-waymaking-painted="true"]'),
                    chapterColors:[...document.querySelectorAll('.waymaking-beat h4')].map(x=>getComputedStyle(x).color),
                    headline:$('.waymaking-resolution').textContent.trim(),
                    copy:$('.thread-copy').textContent.trim(),
                    imageSrc:$('.waymaking-road-art img').currentSrc,
                    hasScrollLock:!!document.body.style.overflow||!!document.documentElement.style.overflow
                  };
                });
                assert.equal(audit.overflow,false,'Horizontal overflow at '+width);
                assert.deepEqual(audit.beatNames,names,'Waymaking chapter titles/order wrong');
                assert.ok(audit.sizes.every(v=>Math.abs(v-audit.sizes[0])<.2),'Purpose Driven size must match other chapter titles');
                assert.equal(audit.storyTopBorder,'0px','Remove introductory separator');
                assert.equal(audit.storyBottomBorder,'0px','Remove closing separator');
                assert.ok(audit.headline.includes("For me, that's what it means to be a waymaker."));
                assert.ok(audit.copy.includes('build towards a positive future, together with bold people'));
                assert.ok(audit.imageSrc.endsWith('waymaking-editorial-ink.avif'));
                assert.ok(audit.maskedSrc.endsWith('waymaking-editorial-ink.avif'));
                assert.equal(audit.hasScrollLock,false,'Never lock document scrolling');
                if(width>=901){
                  assert.equal(audit.roadPosition,'sticky','Desktop art must stay sticky');
                  assert.equal(audit.active,true,'Desktop painter should initialize');
                  assert.notEqual(audit.maskSvgDisplay,'none','Curved path SVG mask must be visible');
                  assert.equal(audit.artVisibility,'hidden','Static picture should not overlap painted SVG');
                  assert.ok(audit.road.width>=300,'Approved art must not shrink to thin lines');
                  assert.ok(audit.pathOffset>=0&&audit.pathOffset<=1000,'Stroke path progress out of range');
                  const first=audit.pathOffset;
                  await page.locator('.waymaking-road-wrap').screenshot({path:'artifacts/paint-first-'+width+'.png'});
                  await page.screenshot({path:'artifacts/reading-first-'+width+'.png'});
                  await page.locator('.waymaking-beat').nth(2).scrollIntoViewIfNeeded();
                  await page.waitForTimeout(250);
                  await page.locator('.waymaking-road-wrap').screenshot({path:'artifacts/paint-middle-'+width+'.png'});
                  await page.locator('.waymaking-beat').last().scrollIntoViewIfNeeded();
                  await page.waitForTimeout(250);
                  const last=await page.locator('[data-waymaking-paint-path]').getAttribute('stroke-dashoffset');
                  assert.ok(Number(last)<first-250,'Artwork must paint progressively along curve');
                  const focus=await page.locator('.waymaking-beat').last().evaluate(el=>getComputedStyle(el.querySelector('h4')).color);
                  const off=await page.locator('.waymaking-beat').first().evaluate(el=>getComputedStyle(el.querySelector('h4')).color);
                  assert.notEqual(focus,off,'Active chapter must become darker');
                  await page.locator('.waymaking-road-wrap').screenshot({path:'artifacts/paint-last-'+width+'.png'});
                  await page.screenshot({path:'artifacts/reading-last-'+width+'.png'});
                  console.log('PAINT '+width+'px',JSON.stringify({first,last,focus,off}));
                }else{
                  assert.equal(audit.roadPosition,'sticky','Mobile painting must remain behind scrolling copy');
                  assert.equal(audit.maskSvgDisplay,'none','Mobile should show full painting without reveal animation');
                  assert.equal(audit.artVisibility,'visible','Mobile background painting must remain visible');
                  assert.ok(Number(audit.artOpacity)<=.16,'Mobile background ink should not impair reading contrast');
                  assert.ok(audit.road.width<=width,'Mobile art must fit viewport');
                  await page.locator('.waymaking-beat').nth(2).scrollIntoViewIfNeeded();
                  await page.waitForTimeout(150);
                  const artTop=await page.locator('.waymaking-road-wrap').evaluate(el=>el.getBoundingClientRect().top);
                  assert.ok(artTop>=-10&&artTop<300,'Mobile background should stay within the sticky viewport');
                  await page.screenshot({path:'artifacts/mobile-middle-'+width+'.png'});
                  console.log('MOBILE '+width+'px',JSON.stringify({artTop,artOpacity:audit.artOpacity,road:audit.road}));
                }
                await page.locator('.waymaking-narrative').screenshot({path:'artifacts/waymaking-'+width+'.png'});
                await page.screenshot({path:'artifacts/home-'+width+'.png',fullPage:true});
                console.log('PASS '+width+'px');
                await page.close();
              }
              const reduced=await browser.newPage({viewport:{width:1440,height:900},reducedMotion:'reduce'});
              await reduced.goto('http://127.0.0.1:8765/humamap-preview/augustkring/',{waitUntil:'networkidle'});
              await reduced.locator('.waymaking-beat').nth(3).scrollIntoViewIfNeeded();
              await reduced.waitForTimeout(100);
              assert.equal(await reduced.locator('.waymaking-narrative').getAttribute('data-waymaking-painted'),null,'Reduced motion disables paint');
              assert.equal(await reduced.locator('.waymaking-road-art').evaluate(el=>getComputedStyle(el).visibility),'visible','Reduced motion shows original image');
              assert.equal(await reduced.locator('.waymaking-paint-art').evaluate(el=>getComputedStyle(el).display),'none','Reduced motion hides animated mask');
              await reduced.close();
              console.log('PASS reduced motion');
            }finally{await browser.close();}
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
      - name: Upload desktop and mobile review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waymaking-pr-screenshots
          path: artifacts/
          if-no-files-found: warn
