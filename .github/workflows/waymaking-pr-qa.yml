name: Waymaking PR browser QA

on:
  pull_request:
    paths:
      - "augustkring/**"
      - ".github/workflows/waymaking-pr-qa.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Verify protected sections and approved text
        run: node augustkring/verify-baseline.mjs
      - name: Check real Chrome rendering
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ak-local/humamap-preview artifacts
          cp -R augustkring /tmp/ak-local/humamap-preview/augustkring
          python3 -m http.server 8765 --directory /tmp/ak-local >/tmp/ak-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/humamap-preview/augustkring/ >/dev/null; then break; fi
            sleep 1
          done
          npm install --prefix /tmp/ak-browser-check --no-audit --no-fund --silent playwright-core@1.55.0
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          CHROME_BIN="$chrome" NODE_PATH=/tmp/ak-browser-check/node_modules node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright-core');
          const widths=[320,390,768,1440];
          const expected=['Creative Thinking','Commercial Understanding','Strategic Judgment','AI-Native Building','Purpose'];
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox']});
            try {
              for(const width of widths){
                const page=await browser.newPage({viewport:{width,height:900}});
                await page.goto('http://127.0.0.1:8765/humamap-preview/augustkring/',{waitUntil:'networkidle'});
                await page.evaluate(()=>document.fonts.ready);
                await page.locator('.waymaking-intro').scrollIntoViewIfNeeded();
                await page.locator('.waymaking-road-art img').evaluate(img=>img.decode());
                const audit=await page.evaluate(()=>{
                  const $=s=>document.querySelector(s);
                  const box=el=>{const r=el.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}};
                  return {
                    overflow:document.documentElement.scrollWidth>window.innerWidth+1,
                    columns:getComputedStyle($('.waymaking-scene')).gridTemplateColumns,
                    copy:box($('.waymaking-copy-column')),
                    art:box($('.waymaking-road-wrap')),
                    imgWidth:$('.waymaking-road-art img').naturalWidth,
                    imgSrc:$('.waymaking-road-art img').currentSrc,
                    beatNames:[...document.querySelectorAll('.waymaking-beat h4')].map(el=>el.textContent.trim()),
                    headingSizes:[...document.querySelectorAll('.waymaking-beat h4')].map(el=>parseFloat(getComputedStyle(el).fontSize)),
                    signoff:$('.waymaking-resolution').textContent.trim(),
                    noScrollTrap:!document.body.style.overflow&&!document.documentElement.style.overflow,
                    intro:$('.thread-copy').textContent.trim(),
                    hasCanvas:!!document.querySelector('[data-waymaking-ink-road]'),
                  };
                });
                assert.equal(audit.overflow,false,'Horizontal overflow at '+width);
                assert.equal(audit.imgWidth,720,'Approved original image not decoded');
                assert.ok(audit.imgSrc.endsWith('waymaking-editorial-ink.avif'),'Original ink image not loaded');
                assert.deepEqual(audit.beatNames,expected,'Waymaking narrative order differs');
                assert.ok(audit.headingSizes.every(v=>Math.abs(v-audit.headingSizes[0])<.2),'Purpose must share heading size');
                assert.ok(audit.signoff.includes("For me, that's what it means to be a waymaker."));
                assert.ok(audit.intro.includes('build towards a positive future, together with bold people'));
                assert.ok(audit.noScrollTrap);
                assert.equal(audit.hasCanvas,false);
                if(width>=901) {
                  assert.ok(audit.art.width>300,'Artwork too small at desktop');
                  assert.ok(audit.copy.x+audit.copy.width<=audit.art.x+10,'Story copy overlaps artwork');
                  const first=page.locator('.waymaking-beat').first();
                  const last=page.locator('.waymaking-beat').last();
                  await first.scrollIntoViewIfNeeded();
                  await page.waitForTimeout(100);
                  const start=await page.locator('.waymaking-road-art img').evaluate(el=>el.style.clipPath);
                  await page.screenshot({path:'artifacts/stage-first-'+width+'.png'});
                  await last.scrollIntoViewIfNeeded();
                  await page.waitForTimeout(100);
                  const finish=await page.locator('.waymaking-road-art img').evaluate(el=>el.style.clipPath);
                  const pct=str=>Number(str.match(/([\d.]+)%/)?.[1]);
                  assert.ok(Number.isFinite(pct(start))&&Number.isFinite(pct(finish))&&pct(finish)<pct(start),'Scroll must progressively reveal ink');
                  assert.equal(await page.locator('.waymaking-narrative').getAttribute('data-waymaking-active'),'true');
                  await page.screenshot({path:'artifacts/stage-last-'+width+'.png'});
                } else {
                  assert.ok(audit.art.width<=420,'Mobile artwork must stay within viewport');
                  assert.ok(audit.art.height<=470,'Mobile artwork must not dominate entire page');
                  assert.equal(await page.locator('.waymaking-road-art img').evaluate(el=>el.style.clipPath),'','Mobile should have static artwork');
                }
                await page.locator('.waymaking-narrative').screenshot({path:'artifacts/waymaking-'+width+'.png'});
                await page.screenshot({path:'artifacts/home-'+width+'.png',fullPage:true});
                console.log('PASS '+width+'px',JSON.stringify(audit));
                await page.close();
              }
              const reducedPage=await browser.newPage({viewport:{width:1440,height:900},reducedMotion:'reduce'});
              await reducedPage.goto('http://127.0.0.1:8765/humamap-preview/augustkring/',{waitUntil:'networkidle'});
              await reducedPage.locator('.waymaking-beat').nth(3).scrollIntoViewIfNeeded();
              await reducedPage.waitForTimeout(100);
              assert.equal(await reducedPage.locator('.waymaking-road-art img').evaluate(el=>el.style.clipPath),'','Reduced-motion illustration must be fully visible');
              assert.equal(await reducedPage.locator('.waymaking-narrative').getAttribute('data-waymaking-active'),null,'Reduced-motion content must not fade');
              console.log('PASS reduced-motion');
              await reducedPage.close();
            } finally {await browser.close();}
          })().catch(err=>{console.error(err);process.exitCode=1});
          NODE
      - name: Upload desktop and mobile review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waymaking-pr-screenshots
          path: artifacts/
          if-no-files-found: warn
