name: Waymaking PR browser QA

on:
  pull_request:
    paths:
      - "augustkring/**"
      - ".github/workflows/waymaking-pr-qa.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Verify protected sections and approved text
        run: node augustkring/verify-baseline.mjs
      - name: Check real Chrome rendering
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ak-local/humamap-preview artifacts
          cp -R augustkring /tmp/ak-local/humamap-preview/augustkring
          python3 -m http.server 8765 --directory /tmp/ak-local >/tmp/ak-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/humamap-preview/augustkring/ >/dev/null; then break; fi
            sleep 1
          done
          npm install --prefix /tmp/ak-browser-check --no-audit --no-fund --silent playwright-core@1.55.0
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          CHROME_BIN="$chrome" NODE_PATH=/tmp/ak-browser-check/node_modules node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright-core');
          const viewportWidths=[320,390,768,1024,1440];
          const labels=['Creative Thinking','Commercial Understanding','Strategic Judgment','AI-Native Building','Purpose Driven'];
          const pageURL='http://127.0.0.1:8765/humamap-preview/augustkring/';
          const wait=()=>new Promise(resolve=>setTimeout(resolve,100));
          async function snapshot(page){
            return page.evaluate(()=>{
              const $=s=>document.querySelector(s);
              const rect=el=>{const r=el.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height,center:(r.left+r.right)/2}};
              return {
                docOverflow:document.documentElement.scrollWidth>innerWidth+1,
                story:rect($('.waymaking-scene')),
                road:rect($('.waymaking-road-wrap')),
                firstTitle:rect(document.querySelector('.waymaking-beat h3')),
                pinnedAnchor:Number.parseFloat(getComputedStyle($('.waymaking-road-wrap')).top),
                roadPosition:getComputedStyle($('.waymaking-road-wrap')).position,
                roadVisibility:getComputedStyle($('.waymaking-road-wrap')).visibility,
                roadOpacity:parseFloat(getComputedStyle($('.waymaking-road-wrap')).opacity),
                pinned:$('.waymaking-narrative').dataset.waymakingPinned,
                ready:$('.waymaking-narrative').dataset.waymakingReady,
                narrative:rect($('.waymaking-narrative')),
                artOpacity:parseFloat(getComputedStyle($('.waymaking-paint-art')).opacity),
                staticOpacity:parseFloat(getComputedStyle($('.waymaking-road-art')).opacity),
                brushVisible:getComputedStyle($('.waymaking-paint-art')).display,
                staticVisible:getComputedStyle($('.waymaking-road-art')).visibility,
                painted:$('.waymaking-narrative').dataset.waymakingPainted,
                complete:$('.waymaking-narrative').dataset.waymakingComplete,
                offset:Number($('[data-waymaking-paint-path]').getAttribute('stroke-dashoffset')),
                cols:[...document.querySelectorAll('.waymaking-copy')].map(rect),
                textNames:[...document.querySelectorAll('.waymaking-beat h3')].map(h=>h.getAttribute('aria-label')||h.textContent.trim()),
                headingSizes:[...document.querySelectorAll('.waymaking-beat h3')].map(h=>parseFloat(getComputedStyle(h).fontSize)),
                firstLetters:[...document.querySelectorAll('.waymaking-beat h3')].map(h=>h.querySelectorAll('.waymaking-letter').length),
                headingColors:[...document.querySelectorAll('.waymaking-beat h3')].map(h=>getComputedStyle(h).color),
                originalSrc:$('.waymaking-road-art img').currentSrc,
                originalLoaded:$('.waymaking-road-art img').naturalWidth>0,
                sectionTitleVisible:!!$('.waymaking-intro'),
                signoff:$('.waymaking-resolution').textContent.trim(),
                purposeText:$('.thread-copy').textContent.trim(),
                scrollLocked:!!document.body.style.overflow||!!document.documentElement.style.overflow
              };
            });
          }
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox']});
            try {
              for(const width of viewportWidths){
                const page=await browser.newPage({viewport:{width,height:900}});
                await page.goto(pageURL,{waitUntil:'networkidle'});
                await page.evaluate(()=>document.fonts.ready);
                await page.locator('.waymaking-road-art img').evaluate(img=>img.decode());
                const beats=page.locator('.waymaking-beat');
                // Position the first heading exactly at the ink's fixed
                // screen anchor. Inspect the preceding position first to
                // prove that Where I add value cannot reveal the road.
                const activateAt=await page.evaluate(()=>{
                  const heading=document.querySelector('.waymaking-beat h3');
                  const road=document.querySelector('.waymaking-road-wrap');
                  const anchoredTop=Number.parseFloat(getComputedStyle(road).top);
                  return scrollY+heading.getBoundingClientRect().top-(anchoredTop+16);
                });
                const scrollToAnchor=async y=>{
                  await page.evaluate(y=>scrollTo({top:y,behavior:'instant'}),y);
                  await page.waitForTimeout(120);
                };
                await scrollToAnchor(Math.max(0,activateAt-180));
                const beforeTitle=await snapshot(page);
                assert.equal(beforeTitle.pinned,undefined,
                  'Road must stay HIDDEN before Creative Thinking, including Where I add value');
                assert.equal(beforeTitle.roadVisibility,'hidden',
                  'Ink should not appear before the first heading reaches its anchor');
                await page.screenshot({path:'artifacts/before-creative-'+width+'.png'});
                await scrollToAnchor(activateAt+12);
                const first=await snapshot(page);
                assert.ok(Math.abs(first.firstTitle.top-first.road.top)<25,
                  'Road top must align with Creative Thinking title at first reveal');
                assert.ok(first.roadOpacity>0&&first.roadOpacity<.6,
                  'Ink must start as a small gentle reveal alongside the heading');
                await page.screenshot({path:'artifacts/creative-start-'+width+'.png'});
                assert.equal(first.docOverflow,false,'Horizontal page overflow at '+width);
                assert.equal(first.scrollLocked,false,'Do not trap scrolling');
                assert.equal(first.sectionTitleVisible,false,'Remove redundant The way I work and Waymaking heading');
                assert.deepEqual(first.textNames,labels,'The five semantic chapters must keep their agreed sequence');
                assert.ok(first.headingSizes.every(x=>Math.abs(x-first.headingSizes[0])<.2),'All chapter headings must share one type size');
                assert.ok(first.signoff.includes("For me, that's what it means to be a waymaker."));
                assert.ok(first.purposeText.includes('build towards a positive future, together with bold people'));
                assert.ok(first.originalSrc.endsWith('waymaking-editorial-ink.avif'),'Re-use approved ink artwork');
                assert.equal(first.originalLoaded,true,'Original art has not loaded');
                assert.ok(first.road.width>190,'The winding road must not become a narrow drawn line');
                assert.ok(Math.abs(first.road.center-first.story.center)<3,'Ink road must be centered');
                assert.equal(first.painted,'true','Scroll-driven brush should work on all widths');
                assert.equal(first.ready,'true','JS viewport-pin enhancement must initialize');
                assert.equal(first.pinned,'true','Artwork must stay pinned while the first chapter is visible');
                assert.equal(first.roadPosition,'fixed','The road must be position:fixed, not sticky');
                assert.ok(first.firstLetters.every(x=>x>8),'Visual heading glyph animation is missing');
                if(width<=900){
                  const inactiveBody=await beats.last().locator('p').evaluate(el=>getComputedStyle(el).color);
                  assert.equal(inactiveBody,'rgb(45, 63, 83)','Mobile inactive copy must stay dark enough to read over ink');
                }
                assert.notEqual(first.brushVisible,'none','Scroll-masked artwork must remain active on mobile and desktop');

                const byScreenCenter=await page.evaluate(()=>{
                  const beats=[...document.querySelectorAll('.waymaking-beat')];
                  return beats.map(b=>{const r=b.getBoundingClientRect();return scrollY+r.top+r.height/2-innerHeight*.51;});
                });
                const paintFinish=await page.evaluate(()=>{
                  const title=[...document.querySelectorAll('.waymaking-beat h3')].at(-1);
                  return scrollY+title.getBoundingClientRect().top-innerHeight*.51;
                });
                // Scroll by actual chapter centers, never synthetic section indices.
                let recorded=[];
                for(let step=0;step<=12;step++){
                  const y=(activateAt+75) + (paintFinish-activateAt-75)*step/12;
                  await page.evaluate(y=>window.scrollTo(0,y),y);
                  await page.waitForTimeout(80);
                  const state=await snapshot(page);
                  recorded.push(state);
                  if(step===0||step===3||step===6||step===9||step===12){
                    await page.locator('.waymaking-road-wrap').screenshot({path:'artifacts/painting-'+width+'-'+step+'.png'});
                    if(step===6) await page.screenshot({path:'artifacts/focus-middle-'+width+'.png'});
                  }
                }
                for(let i=1;i<recorded.length;i++)
                  assert.ok(recorded[i].offset<=recorded[i-1].offset+2,'Paint offset must advance continuously even if user scrolls little');
                assert.ok(recorded[0].offset-recorded.at(-1).offset>850,'Painting must progress through the full illustration');
                for(const state of recorded){
                  assert.equal(state.pinned,'true','Art pin must span ALL chapter centers: '+width);
                  assert.equal(state.roadPosition,'fixed','The road may never become sticky during the five chapters');
                  assert.equal(state.roadVisibility,'visible','Fixed road should be visible during the chapters');
                }
                const roadHeights=recorded.map(s=>s.road.top);
                const min=Math.min(...roadHeights), max=Math.max(...roadHeights);
                assert.ok(max-min<3,'Road must be viewport-anchored while chapters move: '+width+' delta '+(max-min));
                if(width>=901){
                  for(const s of [recorded[2],recorded[6],recorded[10]]){
                    for(let i=0;i<s.cols.length;i++){
                      if(i%2===0)assert.ok(s.cols[i].right<s.road.left+12,'Odd beat should be left of central ink at '+width);
                      else assert.ok(s.cols[i].left>s.road.right-12,'Even beat should be right of central ink at '+width);
                    }
                  }
                }else{
                  assert.ok(first.artOpacity>=.19&&first.artOpacity<=.30,'Mobile painting should be visible but not dominate the text');
                }

                // Important regression: the old sticky art slid out of view once
                // its containing block ended. Verify a fixed road throughout all
                // chapters and a stationary fade before the sign-off.
                const narrativeBounds=await page.evaluate(()=>{
                  const r=document.querySelector('.waymaking-narrative').getBoundingClientRect();
                  const conclusion=document.querySelector('.waymaking-resolution').getBoundingClientRect();
                  return {top:scrollY+r.top,bottom:scrollY+r.bottom,
                    conclusionTop:scrollY+conclusion.top,height:innerHeight};
                });
                const enterAt=activateAt+20;
                const exitAt=narrativeBounds.conclusionTop-narrativeBounds.height*.84;
                const sampleScroll=async y=>{
                  await page.evaluate(y=>scrollTo({top:y,behavior:'instant'}),y);
                  await page.waitForTimeout(100);
                  return snapshot(page);
                };
                const entering=await sampleScroll(enterAt);
                const ending=await sampleScroll(exitAt);
                assert.equal(entering.pinned,'true','Art must pin only when Creative Thinking reaches the fixed viewport line');
                assert.equal(ending.pinned,'true','Art must stay pinned through the final fade after the fifth chapter');
                assert.equal(entering.roadPosition,'fixed');
                assert.equal(ending.roadPosition,'fixed');
                assert.ok(Math.abs(entering.road.top-ending.road.top)<1,
                  'Artwork must NOT move or slide when approaching the section end: '+width);
                assert.ok(Math.abs(entering.road.left-ending.road.left)<1,
                  'Artwork must remain horizontally fixed for the entire story: '+width);
                assert.ok(entering.roadOpacity>0&&entering.roadOpacity<1,
                  'Enter softly without moving the painting');
                assert.ok(ending.roadOpacity>0&&ending.roadOpacity<1,
                  'Leave softly without moving the painting');
                const signoffTextPosition=await page.locator('.waymaking-resolution p')
                  .evaluate(el=>el.getBoundingClientRect().top);
                assert.ok(signoffTextPosition>=ending.road.bottom-8,
                  'The road should finish its fade before the signoff enters the artwork area');
                await page.screenshot({path:'artifacts/pinned-ending-'+width+'.png'});
                const outAfter=await sampleScroll(narrativeBounds.conclusionTop-narrativeBounds.height*.70);
                assert.equal(outAfter.pinned,undefined,'Art should unpin only after fading out');
                assert.equal(outAfter.roadVisibility,'hidden',
                  'Never show the road sliding away when it leaves the story');
                await page.screenshot({path:'artifacts/after-waymaking-'+width+'.png'});
                const inBefore=await sampleScroll(Math.max(0,activateAt-120));
                assert.equal(inBefore.pinned,undefined,'Art must not float over content before Waymaking');
                assert.equal(inBefore.roadVisibility,'hidden');
                console.log('CREATIVE_START '+width,JSON.stringify({activateAt,firstHeadingTop:first.firstTitle.top,fixedRoadTop:first.road.top,opacity:first.roadOpacity}));
                console.log('PIN '+width,JSON.stringify({
                  entryTop:entering.road.top,fadeTop:ending.road.top,
                  entryOpacity:entering.roadOpacity,fadeOpacity:ending.roadOpacity,
                  hiddenAfter:outAfter.roadVisibility
                }));
                // The Waymaker sign-off and the first venture cards must be
                // unobscured; the road should already be invisible, not drifting
                // over the text as it did in the first viewport-fixed attempt.
                const signoffTop=await page.locator('.waymaking-resolution').evaluate(el=>
                  scrollY+el.getBoundingClientRect().top);
                const signoffOnScreen=await sampleScroll(signoffTop-page.viewportSize().height*.44);
                assert.equal(signoffOnScreen.pinned,undefined,
                  'Ink must vanish before the centered Waymaker closing copy');
                assert.equal(signoffOnScreen.roadVisibility,'hidden',
                  'The road cannot visually cover the Waymaker signoff');
                await page.screenshot({path:'artifacts/clear-signoff-'+width+'.png'});


                // In-between stages must contain a genuine range of heading colors,
                // not instantly swap all the characters at one breakpoint.
                await page.evaluate(y=>window.scrollTo(0,y),(byScreenCenter[0]+byScreenCenter[1])/2);
                await page.waitForTimeout(130);
                const tones=await page.evaluate(()=>[...document.querySelector('.waymaking-beat h3').querySelectorAll('.waymaking-letter')].map(x=>getComputedStyle(x).color));
                assert.ok(new Set(tones).size>=4,'Heading focus should change along individual characters');
                assert.equal(await page.locator('.waymaking-road-art').evaluate(el=>getComputedStyle(el).visibility),'hidden','Only the growing painting should appear before completion');
                await page.evaluate(y=>scrollTo(0,y),byScreenCenter.at(-1)+100);
                await page.waitForTimeout(100);
                assert.equal(await page.locator('.waymaking-narrative').getAttribute('data-waymaking-complete'),'true','Final illustration must be 100 percent original with no residual mask');
                assert.equal(await page.locator('.waymaking-road-art').evaluate(el=>getComputedStyle(el).visibility),'visible');
                await page.locator('.waymaking-narrative').screenshot({path:'artifacts/waymaking-'+width+'.png'});
                await page.screenshot({path:'artifacts/home-'+width+'.png',fullPage:true});
                console.log('PASS '+width,JSON.stringify({road:first.road,stickyDelta:max-min,paintingOffsets:recorded.map(s=>s.offset),tones:new Set(tones).size}));
                await page.close();
              }

              const reduced=await browser.newPage({viewport:{width:1440,height:900},reducedMotion:'reduce'});
              await reduced.goto(pageURL,{waitUntil:'networkidle'});
              await reduced.locator('.waymaking-beat').nth(2).scrollIntoViewIfNeeded();
              await reduced.waitForTimeout(150);
              assert.equal(await reduced.locator('.waymaking-narrative').getAttribute('data-waymaking-painted'),null,'Reduced motion disables staged painting');
              assert.equal(await reduced.locator('.waymaking-narrative').getAttribute('data-waymaking-pinned'),'true','Reduced motion still anchors the full static painting');
              assert.equal(await reduced.locator('.waymaking-road-wrap').evaluate(el=>getComputedStyle(el).position),'fixed');
              assert.equal(await reduced.locator('.waymaking-road-art').evaluate(el=>getComputedStyle(el).visibility),'visible','Reduced motion shows full approved image');
              assert.equal(await reduced.locator('.waymaking-beat h3').first().evaluate(el=>el.querySelectorAll('.waymaking-letter').length),0,'Reduced motion keeps original text');
              await reduced.close();

              const noJS=await browser.newPage({viewport:{width:390,height:900},javaScriptEnabled:false});
              await noJS.goto(pageURL,{waitUntil:'load'});
              assert.equal(await noJS.locator('.waymaking-road-art').evaluate(el=>getComputedStyle(el).visibility),'visible','No-JS artwork fallback visible');
              assert.deepEqual(await noJS.locator('.waymaking-beat h3').allTextContents(),labels);
              await noJS.close();
              console.log('PASS reduced motion and no-JS fallbacks');
            }finally{await browser.close();}
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
      - name: Upload desktop and mobile review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waymaking-pr-screenshots
          path: artifacts/
          if-no-files-found: warn
