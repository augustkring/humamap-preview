                  privacy:!!document.querySelector('.home-footer a[href="privacy/"]'),
                  overflow:document.documentElement.scrollWidth>innerWidth+1,
                  heroCentred:(() => {
                    const r=document.querySelector('.perspectives-hero').getBoundingClientRect();
                    const m=document.querySelector('.home-main').getBoundingClientRect();
                    return getComputedStyle(document.querySelector('.perspectives-hero')).textAlign==='center' &&
                      Math.abs((r.left+r.right)/2-(m.left+m.right)/2)<1.5;
                  })(),
                  introCentred:(() => {
                    const r=document.querySelector('.perspectives-hero > p').getBoundingClientRect();
                    const m=document.querySelector('.perspectives-hero').getBoundingClientRect();
                    return Math.abs((r.left+r.right)/2-(m.left+m.right)/2)<1.5;
                  })(),
                  formCentred:(() => {
                    const r=document.querySelector('.perspectives-newsletter-form').getBoundingClientRect();
                    const m=document.querySelector('.perspectives-hero').getBoundingClientRect();
                    return Math.abs((r.left+r.right)/2-(m.left+m.right)/2)<1.5;
                  })(),
                  libraryCentred:(() => {
                    const r=document.querySelector('.perspectives-library').getBoundingClientRect();
                    const m=document.querySelector('.home-main').getBoundingClientRect();
                    return Math.abs((r.left+r.right)/2-(m.left+m.right)/2)<1.5;
                  })()
                }));
                assert.ok(Math.abs(perspectivesType.h1-homepageTypography.h1)<.2,'Perspectives H1 matches homepage');
                assert.ok(Math.abs(perspectivesType.h2-homepageTypography.h2)<.2,'Perspectives H2 matches homepage');
                assert.ok(Math.abs(perspectivesType.lead-homepageTypography.lead)<.2,'Perspectives lead matches homepage');
                assert.equal(perspectivesType.intro,'Ideas, observations and questions I write down to understand better, and share when they might be useful to others.');
                assert.ok(!perspectivesType.hasConsentNotice && perspectivesType.email==='email' && perspectivesType.privacy && !perspectivesType.overflow,'Form accessible and footer privacy preserved');
                assert.ok(perspectivesType.heroCentred && perspectivesType.introCentred && perspectivesType.formCentred && perspectivesType.libraryCentred,'Perspectives stays centred at every viewport');
                if(width===390||width===1440) await page.locator('.perspectives-hero').screenshot({path:`/tmp/ak-browser-check/perspectives-page-${width}.png`});
                await page.close();
              }
            } finally {await browser.close();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE

      - name: Audit real browser reading sizes and reflow across pages
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" NODE_PATH=/tmp/ak-browser-check/node_modules node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright-core');
          const base = 'https://augustkring.github.io/humamap-preview/augustkring/';
          const cases = [
            { path: '', selector: '.thread-copy p', desktop: 18, mobile: 18 },
            { path: '', selector: '.waymaking-copy p', desktop: 16, mobile: 17 },
            { path: '', selector: '.perspective-copy > p:not(.perspective-statement)', desktop: 18, mobile: 18 },
            { path: '', selector: '.work-card p', desktop: 16, mobile: 17 },
            { path: 'about/', selector: '.about-toolkit-list h3', desktop: 21, desktopMin: 21, desktopMax: 26, mobile: 21, heading: true },
            { path: 'about/', selector: '.about-lens-copy p', desktop: 17, mobile: 18 },
            { path: 'about/', selector: '.about-story-prose p', desktop: 18, mobile: 18 },
            { path: 'perspectives/', selector: '.perspectives-hero > p', desktop: 19, mobile: 18 },
            { path: 'perspectives/', selector: '.perspective-index-summary', desktop: 17, mobile: 18 },
            { path: 'perspectives/rethinking-the-company/', selector: '.article-prose > p:not(.article-lead)', desktop: 18, mobile: 18 },
            { path: 'perspectives/rethinking-the-company/', selector: '.article-comparison td', desktop: 16, mobile: 17 },
            { path: 'perspectives/europe-at-a-crossroads/', selector: '.article-prose > p:not(.article-lead)', desktop: 18, mobile: 18 },
            { path: 'privacy/', selector: '.legal-content p', desktop: 18, mobile: 18 },
          ];
          (async () => {
            const browser = await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox']});
            try {
              for (const width of [320,390,768,1024,1440]) {
                const page = await browser.newPage({ viewport: {width,height:940}});
                const visited = new Set();
                for (const target of cases) {
                  if (!visited.has(target.path)) {
                    await page.goto(base + target.path, { waitUntil: 'networkidle', timeout: 45000 });
                    await page.evaluate(() => document.fonts.ready);
                    visited.add(target.path);
                  }
                  const metrics = await page.locator(target.selector).first().evaluate(element => {
                    const css=getComputedStyle(element);
                    const rect=element.getBoundingClientRect();
                    return {
                      fontSize:parseFloat(css.fontSize),
                      lineHeight:parseFloat(css.lineHeight),
                      width:rect.width,
                      height:rect.height,
                      viewportOverflow:document.documentElement.scrollWidth>innerWidth+1
                    };
                  });
                  const mobile=width<=760;
                  const expected=mobile?target.mobile:target.desktop;
                  const min=mobile?target.mobile:(target.desktopMin??target.desktop);
                  const max=mobile?target.mobile:(target.desktopMax??target.desktop);
                  console.log('Typography',width,target.path||'home',target.selector,metrics);
                  assert.ok(metrics.fontSize>=min-.1&&metrics.fontSize<=max+.1,
                    `Expected ${min}-${max}px for ${target.selector} at ${width}`);
                  assert.ok(metrics.lineHeight/metrics.fontSize >= (target.heading ? 1.05 : 1.45), `Readable line height for ${target.selector}`);
                  assert.ok(metrics.width>0&&metrics.height>0, `Text block is visible: ${target.selector}`);
                  assert.equal(metrics.viewportOverflow,false,`No horizontal scrolling on ${target.path} at ${width}px`);
                }
                for (const route of ['','about/','perspectives/rethinking-the-company/']) {
                  await page.goto(base + route, {waitUntil:'networkidle',timeout:45000});
                  await page.evaluate(() => document.fonts.ready);
                  if (width===390||width===1440) {
                    const section=route===''?'.thread-section':route==='about/'?'#toolkit':'.article-layout';
                    await page.locator(section).first().screenshot({path:`/tmp/ak-browser-check/typography-${route.replaceAll('/','-')||'home'}-${width}.png`});
                  }
                  // Representative 200%-sized prose at narrow viewports checks text
                  // growth and wrapping; this is not a complete WCAG conformance audit.
                  if (width===390) {
                    const selected=route===''?'.thread-copy p':route==='about/'?'.about-toolkit-list h3':'.article-prose > p:not(.article-lead)';
                    await page.locator(selected).first().evaluate(e=>{e.style.fontSize='34px';e.style.lineHeight='1.5';});
                    assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1),false,`Scaled text must reflow on ${route||'home'}`);
                  }
                }
                await page.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE

