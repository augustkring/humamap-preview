name: Verify August Kring GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "augustkring/index.html"
      - "augustkring/styles.css"
      - ".github/workflows/verify-augustkring-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for published HTML and verify deployed CSS
        shell: bash
        run: |
          set -euo pipefail
          base="https://augustkring.github.io/humamap-preview/augustkring/"
          expected="styles.css?v=20261009-readable-signoff-v27"
          expected_copy="From there, I shape the business model, validate demand with customers and get the first viable version built."
          for attempt in $(seq 1 24); do
            status="$(curl -sSL --max-time 15 -o /tmp/augustkring.html -w '%{http_code}' "$base" || true)"
            echo "Attempt ${attempt}: public HTML HTTP ${status}"
            if [ "$status" = "200" ] && grep -Fq "$expected" /tmp/augustkring.html && grep -Fq "$expected_copy" /tmp/augustkring.html && grep -Fq "I've always been curious about how businesses evolve, technology advances and people grow." /tmp/augustkring.html && grep -Fq "It became my own kind of business school" /tmp/augustkring.html; then
              echo "Approved About, profile copy and stylesheet version are published."
              break
            fi
            if [ "$attempt" = "24" ]; then echo "::error::Public HTML is not updated"; exit 1; fi
            sleep 10
          done
          grep -Fq "Exploring how AI and human-centric innovation can make businesses more capable, resilient and sustainable." /tmp/augustkring.html
          grep -Fq "I turn those opportunities into business concepts and take the lead on strategy and innovation." /tmp/augustkring.html
          grep -Fq "That’s how my creative thinking, strategic judgement and drive to build come together." /tmp/augustkring.html
          grep -Fq '<span>Connect on LinkedIn</span><svg class="arrow arrow-up-right"' /tmp/augustkring.html
          grep -Fq '<span>Email me</span><svg class="arrow arrow-up-right"' /tmp/augustkring.html
          grep -Fq 'href="mailto:ak@augustkring.com"' /tmp/augustkring.html
          grep -Fq '<h2 id="work-title">Current focus</h2>' /tmp/augustkring.html
          grep -Fq '<p class="signoff-name">August Kring</p>' /tmp/augustkring.html
          ! grep -Fq 'class="signoff-signature"' /tmp/augustkring.html
          curl -fsSL --max-time 20 "${base}${expected}" -o /tmp/augustkring.css
          grep -Fq 'text-wrap: balance;' /tmp/augustkring.css
          grep -Fq 'max-width: none;' /tmp/augustkring.css
          curl -fsSL --max-time 20 "${base}assets/blentera-horizontal-color.svg" -o /dev/null
          grep -Fq '.personal-signoff .signoff-name {' /tmp/augustkring.css
          echo "Public HTML and CSS contain the approved content and responsive width rules."

      - name: Check hero text rendering in desktop and mobile Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "::error::Chrome not installed"; exit 1; }
          mkdir -p /tmp/ak-browser-check
          npm install --prefix /tmp/ak-browser-check --no-audit --no-fund --silent playwright-core@1.55.0
          CHROME_BIN="$chrome" NODE_PATH=/tmp/ak-browser-check/node_modules node <<'NODE'
          const assert = require('node:assert/strict');
          const {chromium} = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({executablePath:process.env.CHROME_BIN, headless:true, args:['--no-sandbox']});
            try {
              for (const width of [390, 768, 1440]) {
                const page = await browser.newPage({viewport:{width,height:900}});
                await page.goto('https://augustkring.github.io/humamap-preview/augustkring/', {waitUntil:'networkidle',timeout:45000});
                await page.evaluate(() => document.fonts.ready);
                const metrics = await page.evaluate(() => {
                  const copy=document.querySelector('.hero-copy');
                  const focus=document.querySelector('.hero-focus');
                  const title=document.querySelector('#hero-title');
                  const style=getComputedStyle(focus);
                  const size=focus.getBoundingClientRect();
                  const lineHeight=parseFloat(style.lineHeight);
                  return {
                    copyWidth:copy.getBoundingClientRect().width,
                    focusWidth:size.width,
                    titleWidth:title.getBoundingClientRect().width,
                    maxWidth:style.maxWidth,
                    textWrap:style.textWrap,
                    textOverflow:style.textOverflow,
                    overflow:style.overflow,
                    approximateLines: Math.round(size.height/lineHeight),
                    horizontalOverflow:document.documentElement.scrollWidth>innerWidth+1,
                    isVisible:size.width>0&&size.height>0
                  };
                });
                console.log('Hero rendering',width,metrics);
                assert.equal(metrics.maxWidth,'none','No arbitrary fixed max-width');
                assert.equal(metrics.textWrap,'balance','Hero paragraph uses balanced wrapping');
                assert.ok(Math.abs(metrics.focusWidth-metrics.copyWidth)<2,'Hero paragraph fills its column');
                assert.equal(metrics.horizontalOverflow,false,'No horizontal viewport overflow');
                assert.equal(metrics.isVisible,true,'Hero paragraph visible');
                assert.ok(metrics.approximateLines<= (width<600 ? 6:width<900 ? 4:3), 'Hero description uses reasonable line count');
                await page.locator('.personal-signoff .signoff-name').scrollIntoViewIfNeeded();
                const signoff = await page.evaluate(() => {
                  const name = document.querySelector('.personal-signoff .signoff-name');
                  const section = document.querySelector('.personal-signoff');
                  const salutation = section.querySelector('p:not(.signoff-name)');
                  const rect = name.getBoundingClientRect();
                  const style = getComputedStyle(name);
                  const boundary = section.getBoundingClientRect();
                  return {
                    name: name.textContent.trim(),
                    salutation: salutation.textContent.trim(),
                    heading: document.querySelector('#work-title').textContent.trim(),
                    fontSize: parseFloat(style.fontSize),
                    fontWeight: style.fontWeight,
                    opacity: parseFloat(style.opacity),
                    visible: rect.width > 0 && rect.height > 0 && style.visibility !== 'hidden',
                    insideContent: rect.left >= boundary.left - 1 && rect.right <= boundary.right + 1,
                    verticalGap: rect.top - salutation.getBoundingClientRect().bottom,
                    unwantedImages: section.querySelectorAll('img').length,
                    horizontalOverflow: document.documentElement.scrollWidth > innerWidth + 1
                  };
                });
                console.log('Readable sign-off rendering', width, signoff);
                assert.equal(signoff.heading, 'Current focus');
                assert.equal(signoff.name, 'August Kring');
                assert.equal(signoff.salutation, 'With curiosity and optimism,');
                assert.equal(signoff.unwantedImages, 0, 'Distorted signature image is no longer rendered');
                assert.ok(signoff.visible && signoff.fontSize >= 17 && signoff.fontSize <= 19);
                assert.equal(signoff.fontWeight, '500');
                assert.equal(signoff.opacity, 1);
                assert.ok(signoff.insideContent && signoff.verticalGap >= 6 && signoff.verticalGap <= 18);
                assert.equal(signoff.horizontalOverflow, false);
                await page.locator('.personal-signoff').screenshot({path:`/tmp/ak-browser-check/signoff-${width}.png`});
                const footer=await page.evaluate(() => {
                  const footer=document.querySelector('.home-footer');
                  const primary=document.querySelector('.footer-primary');
                  const secondary=document.querySelector('.footer-secondary');
                  const computed=getComputedStyle(footer);
                  return {
                    topRule:parseFloat(computed.borderTopWidth),
                    middleRule:parseFloat(getComputedStyle(primary).borderBottomWidth),
                    footerWidth:footer.getBoundingClientRect().width,
                    legalVisible:secondary.getBoundingClientRect().height>0,
                    navLinks:[...document.querySelectorAll('.footer-links a')].length
                  };
                });
                console.log('Footer rendering',width,footer);
                assert.equal(footer.topRule,1,'Footer has a single upper rule');
                assert.equal(footer.middleRule,0,'Footer has no second internal rule');
                assert.ok(footer.legalVisible && footer.navLinks>=3,'Footer links and copyright are visible');
                await page.close();
              }
            } finally {await browser.close();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE

      - name: Save responsive sign-off screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: augustkring-signoff-responsive
          path: /tmp/ak-browser-check/signoff-*.png
          if-no-files-found: warn
          retention-days: 7
