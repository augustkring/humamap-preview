name: Verify August Kring GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "augustkring/index.html"
      - "augustkring/styles.css"
      - "augustkring/assets/waymaking-vector-road-desktop-v15.svg"
      - "augustkring/assets/waymaking-vector-road-mobile-v15.svg"
      - "augustkring/assets/waymaking-ink-road-brush.png"
      - "augustkring/assets/waymaking-ink-road-brush-mobile.png"
      - "augustkring/assets/waymaking-editorial-ink.avif"
      - "augustkring/assets/waymaking-editorial-ink.webp"
      - "augustkring/waymaking-scroll.js"
      - "augustkring/assets/waymaking-dry-brush.png"
      - "augustkring/assets/waymaking-dry-brush-LICENSE.txt"
      - "augustkring/verify-baseline.mjs"
      - "augustkring/EDITORIAL_DESIGN_BASELINE.md"
      - "augustkring/mobile-nav.js"
      - "augustkring/about/index.html"
      - "augustkring/perspectives/index.html"
      - "augustkring/perspectives/rethinking-the-company/index.html"
      - "augustkring/perspectives/europe-at-a-crossroads/index.html"
      - "augustkring/privacy/index.html"
      - "augustkring/unsubscribe/index.html"
      - ".github/workflows/verify-augustkring-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved site baseline
        uses: actions/checkout@v4
      - name: Check locked homepage and shared design
        run: node augustkring/verify-baseline.mjs
      - name: Wait for published HTML and verify deployed CSS
        shell: bash
        run: |
          set -euo pipefail
          trap 'printf "::error::Published check failed at line %s: %s\n" "$LINENO" "$BASH_COMMAND"' ERR
          base="https://augustkring.github.io/humamap-preview/augustkring/"
          expected_home="styles.css?v=20261022-fixed-persistent-road-v20b"
          expected_road_js="waymaking-scroll.js?v=20261022-fixed-persistent-road-v20b"
          expected_shared="styles.css?v=20261014-subtitle-width-v1"
          expected_copy="build towards a positive future, together with bold people"
          for attempt in $(seq 1 24); do
            status="$(curl -sSL --max-time 15 -o /tmp/augustkring.html -w '%{http_code}' "${base}?verification=${GITHUB_SHA}" || true)"
            echo "Attempt ${attempt}: public HTML HTTP ${status}"
            if [ "$status" = "200" ] && grep -Fq "$expected_home" /tmp/augustkring.html && grep -Fq "$expected_road_js" /tmp/augustkring.html && grep -Fq "$expected_copy" /tmp/augustkring.html && grep -Fq "For me, that" /tmp/augustkring.html && grep -Fq "Waymaking Ventures builds businesses" /tmp/augustkring.html; then
              echo "Approved Waymaking homepage, stylesheet and script are published."
              break
            fi
            if [ "$attempt" = "24" ]; then echo "::error::Public HTML is not updated"; exit 1; fi
            sleep 10
          done
          grep -Fq "Exploring how AI and human-centric innovation can make businesses more adaptive, resilient and sustainable." /tmp/augustkring.html
          grep -Fq '<h2 id="thread-title">Where I add value</h2>' /tmp/augustkring.html
          grep -Fq "But greater capacity doesn't automatically make a company more competitive. AI raises the stakes: it amplifies the value of what a company gets right and the cost of what it gets wrong." /tmp/augustkring.html
          grep -Fq 'build towards a positive future, together with bold people' /tmp/augustkring.html
          grep -Fq '<span>Connect on LinkedIn</span><svg class="arrow arrow-up-right"' /tmp/augustkring.html
          grep -Fq '<span>Email me</span><svg class="arrow arrow-up-right"' /tmp/augustkring.html
          grep -Fq 'href="mailto:ak@augustkring.com"' /tmp/augustkring.html
          grep -Fq '<h2 id="work-title">My current focus</h2>' /tmp/augustkring.html
          grep -Fq 'aria-label="Waymaking" data-waymaking-story' /tmp/augustkring.html
          ! grep -Fq 'id="waymaking-title"' /tmp/augustkring.html
          grep -Fq 'class="waymaking-original-source"' /tmp/augustkring.html
          grep -Fq 'class="waymaking-original-reveal"' /tmp/augustkring.html
          grep -Fq 'src="assets/waymaking-editorial-ink.webp"' /tmp/augustkring.html
          grep -Fq 'waymaking-scroll.js?v=20261022-fixed-persistent-road-v20b' /tmp/augustkring.html
          grep -Fq '<path data-waymaking-reveal' /tmp/augustkring.html
          grep -Fq 'Purpose Driven</h3>' /tmp/augustkring.html
          grep -Fq 'maskUnits="userSpaceOnUse"' /tmp/augustkring.html
          ! grep -Fq 'waymaking-brush.js' /tmp/augustkring.html
          ! grep -Fq 'roughjs@4.6.6' /tmp/augustkring.html
          ! grep -Fq 'perfect-freehand' /tmp/augustkring.html
          ! grep -Fq 'waymaking-road.js' /tmp/augustkring.html
          grep -Fq "Where I'm putting that way of thinking to work today." /tmp/augustkring.html
          grep -Fq "For me, that" /tmp/augustkring.html
          grep -Fq "waymaker" /tmp/augustkring.html
          grep -Fq 'waymaking-ventures">Ventures</span>' /tmp/augustkring.html
          ! grep -Fq '<h2 id="about-title">My story</h2>' /tmp/augustkring.html
          grep -Fq '<p class="signoff-name">August Kring</p>' /tmp/augustkring.html
          grep -Fq 'class="signoff-signature"' /tmp/augustkring.html
          grep -Fq 'src="mobile-nav.js?v=20261009-input-focus-v4"' /tmp/augustkring.html
          curl -fsSL --max-time 20 "${base}${expected_home}" -o /tmp/augustkring.css
          grep -Fq 'text-wrap: wrap;' /tmp/augustkring.css
          grep -Fq 'html[data-nav-pointer] .mobile-menu-close:focus-visible' /tmp/augustkring.css
          grep -Fq 'max-width: none;' /tmp/augustkring.css
          grep -Fq 'position: fixed;' /tmp/augustkring.css
          grep -Fq '.waymaking-original-source' /tmp/augustkring.css
          grep -Fq '.waymaking-scene' /tmp/augustkring.css
          grep -Fq '.waymaking-original-reveal' /tmp/augustkring.css
          grep -Fq 'grid-template-columns: minmax(100px, 36%) minmax(0, 1fr);' /tmp/augustkring.css
          ! grep -Fq '.waymaking-copy-column::before' /tmp/augustkring.css
          ! grep -Fq '.waymaking-copy-column::after' /tmp/augustkring.css
          grep -Fq '.waymaking-beat:nth-child(odd)' /tmp/augustkring.css
          grep -Fq '.waymaking-beat:nth-child(even)' /tmp/augustkring.css
          ! grep -Fq '.waymaking-painted-edge--body' /tmp/augustkring.css
          ! grep -Fq '.waymaking-painted-edge--texture' /tmp/augustkring.css
          for art in waymaking-ink-road-brush.png waymaking-ink-road-brush-mobile.png; do
            curl -fsSL --max-time 20 "${base}assets/${art}" -o "/tmp/${art}"
            test "$(xxd -p -l 8 "/tmp/${art}")" = "89504e470d0a1a0a"
            test "$(wc -c < "/tmp/${art}")" -gt 100000
          done
          curl -fsSL --max-time 20 "${base}assets/waymaking-editorial-ink.avif" -o /tmp/waymaking-editorial-ink.avif
          test "$(xxd -p -s 4 -l 8 /tmp/waymaking-editorial-ink.avif)" = "6674797061766966"
          test "$(wc -c < /tmp/waymaking-editorial-ink.avif)" -gt 4000
          curl -fsSL --max-time 20 "${base}assets/waymaking-editorial-ink.webp" -o /tmp/waymaking-editorial-ink.webp
          test "$(xxd -p -l 4 /tmp/waymaking-editorial-ink.webp)" = "52494646"
          test "$(xxd -p -s 8 -l 4 /tmp/waymaking-editorial-ink.webp)" = "57454250"
          curl -fsSL --max-time 20 "${base}waymaking-scroll.js?v=20261022-fixed-persistent-road-v20b" -o /tmp/waymaking-scroll.js
          grep -Fq "prefers-reduced-motion: reduce" /tmp/waymaking-scroll.js
          grep -Fq 'const scheduleUpdate = () =>' /tmp/waymaking-scroll.js
          grep -Fq 'strokeDashoffset' /tmp/waymaking-scroll.js
          grep -Fq 'getTotalLength()' /tmp/waymaking-scroll.js
          grep -Fq 'const roadFraction = () =>' /tmp/waymaking-scroll.js
          grep -Fq 'document.body.appendChild(road)' /tmp/waymaking-scroll.js
          ! grep -Fq 'updateBackdropClip' /tmp/waymaking-scroll.js
          ! grep -Fq -- '--waymaking-viewport-top' /tmp/waymaking-scroll.js
          ! grep -Fq "!picture.currentSrc.endsWith('.avif')" /tmp/waymaking-scroll.js
          ! grep -Fq 'waymakingRoadActive' /tmp/waymaking-scroll.js
          ! grep -Fq '.waymaking-road-surface' /tmp/augustkring.css
          ! grep -Fq '.waymaking-road-underlay' /tmp/augustkring.css
          curl -fsSL --max-time 20 "${base}assets/blentera-horizontal-color.svg" -o /dev/null
          grep -Fq '.personal-signoff .signoff-name {' /tmp/augustkring.css
          grep -Fq '.personal-signoff .signoff-signature {' /tmp/augustkring.css
          grep -Fq 'scrollbar-gutter: stable;' /tmp/augustkring.css
          grep -Fq 'width: clamp(136px, 12.5vw, 156px);' /tmp/augustkring.css
          curl -fsSL --max-time 20 "${base}assets/august-signature-vector-fine.svg?v=20261009-fine-ink-v1" -o /tmp/august-signature.svg
          grep -Fq 'viewBox="0 0 340 314"' /tmp/august-signature.svg
          grep -Fq '<path d=' /tmp/august-signature.svg
          ! grep -Eq '<(script|image|foreignObject)' /tmp/august-signature.svg
          curl -fsSL --max-time 20 "${base}mobile-nav.js?v=20261009-input-focus-v4" -o /tmp/augustkring-mobile-nav.js
          grep -Fq 'dialog.focus({ preventScroll: true })' /tmp/augustkring-mobile-nav.js
          ! grep -Fq 'document.body.style.position' /tmp/augustkring-mobile-nav.js
          for route in about/ perspectives/ perspectives/rethinking-the-company/ perspectives/europe-at-a-crossroads/ privacy/ unsubscribe/; do
            curl -fsSL --max-time 20 "${base}${route}" -o /tmp/augustkring-subpage.html
            grep -Fq "$expected_shared" /tmp/augustkring-subpage.html
            grep -Fq 'src="mobile-nav.js?v=20261009-input-focus-v4"' /tmp/augustkring-subpage.html
          done
          for attempt in $(seq 1 30); do
            curl -fsSL --max-time 20 "${base}about/?verification=${GITHUB_SHA}" -o /tmp/augustkring-about.html
            if grep -Fq '<span>View my LinkedIn profile</span>' /tmp/augustkring-about.html && grep -Fq 'The story so far.' /tmp/augustkring-about.html; then
              echo "The updated About story and shortened professional proof link are published."
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::GitHub Pages has not yet published the new About story revision"
              exit 1
            fi
            sleep 10
          done
          echo "Published hero, signature+name, shared mobile menu and CSS are consistent across pages."

      - name: Check hero text rendering in desktop and mobile Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "::error::Chrome not installed"; exit 1; }
          mkdir -p /tmp/ak-browser-check
          npm install --prefix /tmp/ak-browser-check --no-audit --no-fund --silent playwright-core@1.55.0
          CHROME_BIN="$chrome" NODE_PATH=/tmp/ak-browser-check/node_modules node <<'NODE'
          const assert = require('node:assert/strict');
          const {chromium} = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({executablePath:process.env.CHROME_BIN, headless:true, args:['--no-sandbox']});
            try {
              for (const width of [320, 390, 768, 1024, 1440]) {
                const page = await browser.newPage({viewport:{width,height:900}});
                await page.goto('https://augustkring.github.io/humamap-preview/augustkring/', {waitUntil:'networkidle',timeout:45000});
                await page.evaluate(() => document.fonts.ready);
                const metrics = await page.evaluate(() => {
                  const copy=document.querySelector('.hero-copy');
                  const focus=document.querySelector('.hero-focus');
                  const title=document.querySelector('#hero-title');
                  const style=getComputedStyle(focus);
                  const size=focus.getBoundingClientRect();
                  const lineHeight=parseFloat(style.lineHeight);
                  return {
                    copyWidth:copy.getBoundingClientRect().width,
                    focusWidth:size.width,
                    titleWidth:title.getBoundingClientRect().width,
                    roleWidth:document.querySelector('.hero-role').getBoundingClientRect().width,
                    maxWidth:style.maxWidth,
                    textWrap:style.textWrap,
                    textOverflow:style.textOverflow,
                    overflow:style.overflow,
                    approximateLines: Math.round(size.height/lineHeight),
                    horizontalOverflow:document.documentElement.scrollWidth>innerWidth+1,
                    isVisible:size.width>0&&size.height>0
                  };
                });
                console.log('Hero rendering',width,metrics);
                assert.equal(metrics.maxWidth,'none','No arbitrary fixed max-width');
                assert.equal(metrics.textWrap,'wrap','Hero paragraph uses full natural line measure');
                assert.ok(Math.abs(metrics.focusWidth-metrics.copyWidth)<2,'Exploring description fills the entire hero column');
                assert.ok(Math.abs(metrics.roleWidth-metrics.copyWidth)<2,'Role text has the same hero width');
                assert.ok(Math.abs(metrics.titleWidth-metrics.copyWidth)<2,'Heading has the same hero width');
                assert.equal(metrics.horizontalOverflow,false,'No horizontal viewport overflow');
                assert.equal(metrics.isVisible,true,'Hero paragraph visible');
                assert.ok(metrics.approximateLines<= (width<600 ? 6:width<900 ? 4:3), 'Hero description uses reasonable line count');
                assert.equal((await page.locator('.hero-focus').textContent()).trim(), 'Exploring how AI and human-centric innovation can make businesses more adaptive, resilient and sustainable.');
                const homepageTypography=await page.evaluate(() => ({
                  h1:parseFloat(getComputedStyle(document.querySelector('.hero-copy h1')).fontSize),
                  h2:parseFloat(getComputedStyle(document.querySelector('.thread-lead h2')).fontSize),
                  lead:parseFloat(getComputedStyle(document.querySelector('.hero-focus')).fontSize),
                  leadFamily:getComputedStyle(document.querySelector('.hero-focus')).fontFamily
                }));
                const editorial = await page.evaluate(() => {
                  const statement = document.querySelector('.perspective-statement');
                  const perspectivesBlock = document.querySelector('.perspectives-block');
                  const cardTitle = document.querySelector('.perspective-link-title');
                  return {
                    opener: document.querySelector('.thread-copy p:first-child').textContent.trim(),
                    visionCopy: document.querySelector('.thread-copy p:nth-child(2)').textContent.trim(),
                    purposeCopy: document.querySelector('.thread-copy p:nth-child(3)').textContent.trim(),
                    purposeTitle: document.querySelector('.waymaking-purpose h3').textContent.trim(),
                    workHeading: document.querySelector('#work-title').textContent.trim(),
                    waymakingTitle: document.querySelector('.waymaking-narrative').getAttribute('aria-label'),
                    waymakerDefinition: document.querySelector('.waymaking-resolution p').textContent.trim(),
                    waymakingBeatCount: document.querySelectorAll('.waymaking-beat').length,
                    hasHomepageStory: !!document.querySelector('#about-title'),
                    statementTypeface: getComputedStyle(statement).fontFamily,
                    statementWeight: getComputedStyle(statement).fontWeight,
                    perspectiveSpacing: parseFloat(getComputedStyle(perspectivesBlock).marginTop),
                    cardTitleSize: parseFloat(getComputedStyle(cardTitle).fontSize),
                    bodyOverflow: document.documentElement.scrollWidth > innerWidth + 1
                  };
                });
                console.log('Editorial polish', width, editorial);
                assert.equal(editorial.opener,'I do my best work in the early stages, when a challenge calls for fresh thinking and clear direction. I combine creative thinking with commercial understanding and strategic judgment to spot opportunities and find better ways forward.');
                const homeSubtitleWidths=await page.evaluate(()=>[...document.querySelectorAll('.perspective-lead > p, .homepage-contact .about-home-lead > p')].map(el=>({
                  text:el.textContent.trim(),
                  width:el.getBoundingClientRect().width
                })));
                assert.equal(homeSubtitleWidths.length,2,'Remaining homepage section subtitles are present');
                for(const entry of homeSubtitleWidths) assert.ok(entry.width<=390.5,'Homepage subtitle must stay within shared 390px measure: '+entry.text);
                if(width===1440) {
                  const summary = await page.locator('.thread-copy p:first-child').evaluate(el => ({
                    width: el.getBoundingClientRect().width,
                    height: el.getBoundingClientRect().height,
                    lineHeight: parseFloat(getComputedStyle(el).lineHeight)
                  }));
                  assert.ok(summary.width>=350&&summary.width<=640,'Holistic introduction should have a comfortable reading width');
                  assert.ok(summary.height>summary.lineHeight*2,'Holistic introduction should remain a readable paragraph');
                }
                assert.equal(editorial.visionCopy,"I enjoy giving ambitious ideas direction and bringing people together around a shared vision. But I also like getting hands-on, experimenting and building things myself, using AI to turn ideas into reality.");
                assert.equal(editorial.purposeCopy,"What drives me is the desire to build towards a positive future, together with bold people, create things that matter and leave the world a little better than I found it.");
                assert.equal(editorial.purposeTitle,'Purpose Driven');
                assert.equal((await page.locator('.perspective-copy > p').nth(2).textContent()).trim(),"But greater capacity doesn't automatically make a company more competitive. AI raises the stakes: it amplifies the value of what a company gets right and the cost of what it gets wrong.");
                assert.equal(editorial.workHeading,'My current focus');
                assert.equal(editorial.waymakingTitle,'Waymaking');
                assert.equal(await page.locator('#waymaking-title').count(),0,'The visible introductory Waymaking heading must be removed');
                assert.equal(editorial.waymakerDefinition,"For me, that's what it means to be a waymaker.");
                assert.equal(editorial.waymakingBeatCount,5);
                assert.equal(editorial.hasHomepageStory,false);
                const positions=await page.evaluate(()=>{
                  const beats=[...document.querySelectorAll('.waymaking-beat')];
                  return {
                    titles:beats.map(x=>x.querySelector('h3').getAttribute('aria-label')||
                      x.querySelector('h3').textContent.trim()),
                    centers:beats.map(x=>{
                      const b=x.getBoundingClientRect();
                      return scrollY+b.top+b.height*.5;
                    })
                  };
                });
                assert.deepEqual(positions.titles,[
                  'Creative Thinking','Commercial Understanding','Strategic Judgment',
                  'AI-Native Building','Purpose Driven'
                ]);
                const stages=[];
                for(let index=0;index<5;index++){
                  await page.evaluate(y=>scrollTo({top:Math.max(0,y),behavior:'instant'}),
                    positions.centers[index]-900*.16);
                  await page.waitForTimeout(170);
                  const state=await page.evaluate(()=>{
                    const story=document.querySelector('[data-waymaking-story]');
                    const road=document.querySelector('body > .waymaking-road-wrap[data-waymaking-viewport="true"]');
                    const svg=road.querySelector('.waymaking-original-reveal');
                    const mask=svg.querySelector('[data-waymaking-reveal]');
                  const fullHeight=svg.preserveAspectRatio.baseVal.align;
                    const beatCopies=[...story.querySelectorAll('.waymaking-copy')];
                    const box=x=>{
                      const b=x.getBoundingClientRect();
                      return {top:b.top,left:b.left,right:b.right,bottom:b.bottom,
                        width:b.width,height:b.height};
                    };
                    return {
                      fraction:Number(story.dataset.waymakingProgress),
                      route:box(road),
                      firstHeading:box(story.querySelector('.waymaking-beat h3')),
                      scene:box(story.querySelector('.waymaking-scene')),
                      intro:box(document.querySelector('.thread-summary')),
                      texts:beatCopies.map(box),
                      maskLength:mask.getTotalLength(),
                      fullHeight,
                      featherCount:svg.querySelectorAll('[data-waymaking-feather]').length,
                      maskOffset:parseFloat(mask.style.strokeDashoffset),
                      animated:story.dataset.waymakingAnimated==='true',
                      sticky:getComputedStyle(road).position==='sticky',
                      fixed:getComputedStyle(road).position==='fixed',
                      clipTop:parseFloat(road.style.getPropertyValue('--waymaking-intro-clip'))||0,
                      parent:road.parentElement===document.body,
                      approvedSource:road.querySelector('.waymaking-original-source img')?.getAttribute('src'),
                      approvedPaint:svg.querySelector('image')?.getAttribute('href'),
                      opaqueBacking:!!svg.querySelector('rect,foreignObject'),
                      overflow:document.documentElement.scrollWidth>innerWidth+1,
                      opacity:Number(getComputedStyle(road).opacity)
                    };
                  });
                  assert.equal(state.sticky,false,'Road must not be sticky');
                  assert.equal(state.fixed,true,'Road must be fixed on screen');
                  assert.ok(Math.abs(state.route.top-16)<1,'Fixed road is moving during native scrolling');
                  assert.equal(state.opacity,1,'Whole-road fade is forbidden');
                  assert.equal(state.parent,true,'Road must be portaled to document.body');
                  assert.equal(state.approvedSource,'assets/waymaking-editorial-ink.webp','Source art was replaced');
                  assert.equal(state.approvedPaint,'assets/waymaking-editorial-ink.webp','SVG mask does not reveal original');
                  assert.equal(state.fullHeight,1,'Extended original is not using full fixed viewport height');
                  assert.equal(state.opaqueBacking,false,'No rectangle/card around the art');
                  assert.equal(state.animated,true,'Progressive scroll controller failed');
                  assert.ok(state.fraction>=.09&&state.fraction<=1,
                    'Path did not reach correct drawing stage');
                  const brushFront=Math.min(state.fraction,.055,(1-state.fraction)*.55);
                  const maskExpected=state.maskLength*(1-(state.fraction-brushFront));
                  assert.equal(state.featherCount,7,'Feathered organic route must have seven brush layers');
                  assert.ok(Math.abs(state.maskOffset-maskExpected)<state.maskLength*.008,
                    'Visible SVG does not reflect actual feathered path progress');
                  if(index>0){
                    assert.ok(state.fraction>stages[index-1].fraction+.10,
                      'Road did not grow when chapter changed');
                    assert.ok(Math.abs(state.route.top-16)<1,'Road is not stationary while chapters pass');
                  } else {
                    assert.ok(Math.abs(state.firstHeading.top-state.scene.top)<110,
                      'Creative Thinking starts too far below the beginning of the story');
                  }
                  assert.ok(state.opacity>.99,'The artwork must not fade under the chapter text');
                  const overlap=(x,y)=>
                    Math.max(0,Math.min(x.right,y.right)-Math.max(x.left,y.left))*
                    Math.max(0,Math.min(x.bottom,y.bottom)-Math.max(x.top,y.top));
                  for(const copy of state.texts){
                    assert.equal(overlap(state.route,copy),0,'Road overlaps readable copy');
                  }
                  if(overlap(state.route,state.intro)>0){
                    assert.ok(state.intro.bottom<=state.route.top+1,
                      'Road activated before preceding introduction had cleared');
                  }
                  assert.equal(state.overflow,false,'Horizontal overflow');
                  stages.push(state);
                  if((width===320||width===390||width===1440)){
                    await page.screenshot({path:'/tmp/ak-browser-check/waymaking-progressive-'+width+'-'+index+'.png'});
                  }
                }
                assert.ok(stages.at(-1).fraction-stages[0].fraction>.80,
                  'Road is not visibly expanding across the five chapters');
                const conclusionGap=await page.evaluate(()=>{
                  const last=document.querySelector('.waymaking-purpose .waymaking-copy').getBoundingClientRect();
                  const signoff=document.querySelector('.waymaking-resolution').getBoundingClientRect();
                  return signoff.top-last.bottom;
                });
                assert.ok(conclusionGap>10&&conclusionGap<475,
                  'Waymaker conclusion has an artificial empty screen: '+conclusionGap);
                for(const selector of ['#work','#perspective','.homepage-contact','.home-footer']){
                  const y=await page.locator(selector).first().evaluate(el=>
                    scrollY+el.getBoundingClientRect().top-innerHeight*.42);
                  await page.evaluate(y=>scrollTo({top:Math.max(0,y),behavior:'instant'}),y);
                  await page.waitForTimeout(130);
                  const aftermath=await page.locator('.waymaking-road-wrap').evaluate(el=>({
                    top:el.getBoundingClientRect().top,
                    opacity:Number(getComputedStyle(el).opacity),
                    display:getComputedStyle(el).display,
                    visibility:getComputedStyle(el).visibility,
                    fixed:getComputedStyle(el).position==='fixed',
                    progress:Number(document.querySelector('[data-waymaking-story]').dataset.waymakingProgress)
                  }));
                  assert.equal(aftermath.display,'block','Completed road disappeared before '+selector);
                  assert.equal(aftermath.visibility,'visible','Completed road became hidden before '+selector);
                  assert.equal(aftermath.fixed,true,'Completed road stopped being fixed before '+selector);
                  assert.ok(Math.abs(aftermath.top-16)<1,'Completed road moved before '+selector);
                  assert.equal(aftermath.opacity,1,'Completed road faded before '+selector);
                  assert.equal(aftermath.progress,1,'Completed road no longer stays at 100% before '+selector);
                }
                assert.ok(editorial.statementTypeface.includes('AKFigtree'),'Perspective statement uses Figtree without changing its weight or scale');
                assert.equal(editorial.statementWeight,'700');
                assert.ok(editorial.perspectiveSpacing >= 39 && editorial.perspectiveSpacing <= 57,'Perspectives section is more closely spaced');
                assert.ok(editorial.cardTitleSize >= 20.9 && editorial.cardTitleSize <= 26.1,'Perspective titles approximately 2px smaller');
                assert.equal(editorial.bodyOverflow,false);
                if(width===320||width===390||width===1440) await page.locator('.waymaking-narrative').screenshot({path:`/tmp/ak-browser-check/waymaking-${width}.png`});
                await page.locator('.perspective-section').screenshot({path:`/tmp/ak-browser-check/perspectives-${width}.png`});
                await page.locator('.work-heading').screenshot({path:`/tmp/ak-browser-check/focus-heading-${width}.png`});
                await page.locator('.personal-signoff .signoff-signature').scrollIntoViewIfNeeded();
                await page.locator('.personal-signoff .signoff-signature').evaluate(img => img.decode());
                const signoff = await page.evaluate(() => {
                  const section = document.querySelector('.personal-signoff');
                  const name = section.querySelector('.signoff-name');
                  const signature = section.querySelector('.signoff-signature');
                  const salutation = section.querySelector('p:not(.signoff-name)');
                  const nameBox = name.getBoundingClientRect();
                  const sigBox = signature.getBoundingClientRect();
                  const sectionBox = section.getBoundingClientRect();
                  return {
                    name: name.textContent.trim(),
                    salutation: salutation.textContent.trim(),
                    heading: document.querySelector('#work-title').textContent.trim(),
                    nameVisible: nameBox.height > 0 && nameBox.width > 0,
                    signatureLoaded: signature.complete && signature.naturalWidth === 340 && signature.naturalHeight === 314,
                    signatureAlt: signature.alt,
                    signatureWidth: sigBox.width,
                    imageBeforeName: sigBox.bottom < nameBox.top,
                    insideContent: sigBox.left >= sectionBox.left - 1 && sigBox.right <= sectionBox.right + 1,
                    fontSize: parseFloat(getComputedStyle(name).fontSize),
                    horizontalOverflow: document.documentElement.scrollWidth > innerWidth + 1
                  };
                });
                console.log('Name and original PNG signature', width, signoff);
                assert.equal(signoff.heading, 'My current focus');
                assert.equal(signoff.name, 'August Kring');
                assert.equal(signoff.salutation, 'With curiosity and optimism,');
                assert.equal(signoff.nameVisible, true);
                assert.equal(signoff.signatureLoaded, true);
                assert.equal(signoff.signatureAlt, 'Handwritten signature of August Kring');
                assert.ok(signoff.signatureWidth >= 125 && signoff.signatureWidth <= 144,'Signature matches approved scale');
                assert.ok(signoff.fontSize >= 17 && signoff.fontSize <= 19);
                assert.ok(signoff.imageBeforeName && signoff.insideContent);
                assert.equal(signoff.horizontalOverflow, false);
                const contact = await page.evaluate(() => {
                  const invite=document.querySelector('.homepage-contact-invite').getBoundingClientRect();
                  const signature=document.querySelector('.homepage-contact-signoff').getBoundingClientRect();
                  return {sideBySide:signature.left>invite.right-1,stacked:signature.top>=invite.bottom-1,
                    spacing:parseFloat(getComputedStyle(document.querySelector('.perspective-section')).paddingBottom)};
                });
                if(width>760) assert.ok(contact.sideBySide,'Approved desktop two-group contact');
                else assert.ok(contact.stacked,'Approved mobile contact stacking');
                assert.ok(contact.spacing>=57,'Approved closing rhythm');
                await page.locator('.homepage-contact').screenshot({path:`/tmp/ak-browser-check/contact-${width}.png`});
                await page.locator('.personal-signoff').screenshot({path:`/tmp/ak-browser-check/signoff-${width}.png`});

                if (width <= 840) {
                  await page.evaluate(() => window.scrollTo(0, 0));
                  await page.waitForTimeout(80);
                  const before = await page.evaluate(() => {
                    const header=document.querySelector('.home-header').getBoundingClientRect();
                    const hero=document.querySelector('.home-hero').getBoundingClientRect();
                    return {scrollY:scrollY, viewportWidth:document.documentElement.clientWidth, headerX:header.x, headerY:header.y, heroX:hero.x, heroY:hero.y};
                  });
                  await page.locator('[data-mobile-nav-open]').click();
                  const during = await page.evaluate(() => {
                    const header=document.querySelector('.home-header').getBoundingClientRect();
                    const hero=document.querySelector('.home-hero').getBoundingClientRect();
                    const button=document.querySelector('[data-mobile-nav-close]');
                    const dialog=document.querySelector('#mobile-menu');
                    return {
                      scrollY:scrollY, viewportWidth:document.documentElement.clientWidth,
                      headerX:header.x, headerY:header.y, heroX:hero.x, heroY:hero.y,
                      dialogOpen:dialog.open, expanded:document.querySelector('[data-mobile-nav-open]').getAttribute('aria-expanded'),
                      bodyPosition:getComputedStyle(document.body).position, bodyTop:document.body.style.top,
                      closeOutline:getComputedStyle(button).outlineStyle,
                      closeShadow:getComputedStyle(button).boxShadow,
                      openOutline:getComputedStyle(document.querySelector('[data-mobile-nav-open]')).outlineStyle,
                      menuTop:parseFloat(getComputedStyle(document.querySelector('.mobile-navigation-panel')).marginTop),
                      menuGap:parseFloat(getComputedStyle(document.querySelector('.mobile-navigation-panel')).gap),
                      pointerModality:'navPointer' in document.documentElement.dataset,
                      focusOnDialog:document.activeElement===dialog,
                      horizontalOverflow:document.documentElement.scrollWidth>innerWidth+1
                    };
                  });
                  console.log('Mobile menu pointer open',width,{before,during});
                  assert.equal(during.dialogOpen,true);
                  assert.equal(during.expanded,'true');
                  assert.equal(during.bodyPosition,'static','Do not reposition the page while opening navigation');
                  assert.equal(during.bodyTop,'','No negative body top');
                  assert.equal(during.closeOutline,'none','No outline around X on pointer open');
                  assert.equal(during.openOutline,'none','No outline around burger on pointer open');
                  assert.equal(during.closeShadow,'none','No box shadow ring on X');
                  assert.equal(during.pointerModality,true,'Pointer activation is recorded');
                  assert.ok(during.menuTop>=29 && during.menuTop<=59,'Menu links begin closer to top');
                  assert.ok(during.menuGap>=19.9 && during.menuGap<=28.1,'Menu links use more breathing room');
                  assert.equal(during.focusOnDialog,true,'Pointer opening focuses dialog container');
                  assert.equal(during.horizontalOverflow,false);
                  for(const key of ['scrollY','viewportWidth','headerX','headerY','heroX','heroY']) {
                    assert.ok(Math.abs(during[key]-before[key]) < 1.1,`No layout/scroll shift for ${key}`);
                  }
                  await page.screenshot({path:`/tmp/ak-browser-check/menu-open-${width}.png`});
                  await page.mouse.wheel(0,450);
                  await page.waitForTimeout(60);
                  assert.ok(Math.abs((await page.evaluate(() => scrollY))-before.scrollY)<1.1,'Background stays locked while menu is open');
                  await page.locator('[data-mobile-nav-close]').click();
                  await page.waitForFunction(() => !document.querySelector('#mobile-menu').open && document.querySelector('[data-mobile-nav-open]').getAttribute('aria-expanded') === 'false');
                  assert.equal(await page.locator('[data-mobile-nav-open]').getAttribute('aria-expanded'),'false');
                  assert.ok(Math.abs((await page.evaluate(() => scrollY))-before.scrollY)<1.1,'Closing does not jump page');

                  await page.locator('[data-mobile-nav-open]').focus();
                  await page.keyboard.press('Enter');
                  const focus = await page.evaluate(() => {
                    const button=document.querySelector('[data-mobile-nav-close]');
                    const style=getComputedStyle(button);
                    return {onClose:document.activeElement===button,outline:style.outlineStyle,shadow:style.boxShadow,fill:style.backgroundColor};
                  });
                  console.log('Mobile menu keyboard focus',width,focus);
                  assert.equal(focus.onClose,true,'Keyboard navigation focuses close control');
                  assert.equal(focus.outline,'none','Keyboard focus never draws a frame');
                  assert.equal(focus.shadow,'none','Keyboard focus never draws a shadow ring');
                  assert.notEqual(focus.fill,'rgba(0, 0, 0, 0)','Keyboard focus remains visibly indicated by a soft fill');
                  await page.keyboard.press('Escape');
                  await page.waitForFunction(() => !document.querySelector('#mobile-menu').open && document.querySelector('[data-mobile-nav-open]').getAttribute('aria-expanded') === 'false');
                  assert.equal(await page.locator('[data-mobile-nav-open]').getAttribute('aria-expanded'),'false');
                  assert.equal(await page.locator('[data-mobile-nav-open]').evaluate(el => document.activeElement===el),true,'Focus returns to opener on Escape');

                  // Test scroll continuity beyond the first viewport, where fixed-body locking used to jump.
                  await page.evaluate(() => window.scrollTo(0, 440));
                  await page.waitForTimeout(100);
                  const middleBefore=await page.evaluate(() => scrollY);
                  await page.evaluate(() => document.querySelector('[data-mobile-nav-open]').click());
                  assert.equal(await page.locator('#mobile-menu').evaluate(el => el.open),true);
                  assert.ok(Math.abs((await page.evaluate(() => scrollY))-middleBefore)<1.1,'Opening at prior scroll position must not jump');
                  await page.keyboard.press('Escape');
                  await page.waitForFunction(() => !document.querySelector('#mobile-menu').open && document.querySelector('[data-mobile-nav-open]').getAttribute('aria-expanded') === 'false');
                  assert.ok(Math.abs((await page.evaluate(() => scrollY))-middleBefore)<1.1,'Closing restores the same scroll position');
                } else {
                  assert.equal(await page.locator('[data-mobile-nav-open]').isVisible(),false);
                }
                const footer=await page.evaluate(() => {
                  const container=document.querySelector('.home-footer');
                  const nav=container.querySelector('.footer-links');
                  const meta=container.querySelector('.footer-meta');
                  const computed=getComputedStyle(container);
                  return {
                    topRule:parseFloat(computed.borderTopWidth),
                    copyrightVisible:meta.getBoundingClientRect().height>0 && meta.textContent.includes('August Kring'),
                    privacyVisible:!!meta.querySelector('a[href="privacy/"]'),
                    noWordmark:!container.querySelector('.footer-wordmark'),
                    navLinks:nav.querySelectorAll('a').length,
                    horizontalOverflow:document.documentElement.scrollWidth>innerWidth+1
                  };
                });
                console.log('Unified footer rendering',width,footer);
                assert.equal(footer.topRule,1,'Footer has one upper rule');
                assert.ok(footer.copyrightVisible && footer.privacyVisible && footer.navLinks===3,'Footer navigation and privacy');
                assert.ok(footer.noWordmark && !footer.horizontalOverflow,'No footer wordmark or horizontal overflow');

                await page.goto('https://augustkring.github.io/humamap-preview/augustkring/about/',{waitUntil:'networkidle',timeout:45000});
                await page.evaluate(() => document.fonts.ready);
                const aboutProof = await page.evaluate(() => {
                  const hero=document.querySelector('.about-personal-hero');
                  const story=document.querySelector('#story');
                  const skills=document.querySelector('#skills');
                  const paragraphs=[...document.querySelectorAll('#story .about-story-content p')];
                  const externalLinks=[...document.querySelectorAll('#story .about-story-content p a')].map(a=>({text:a.textContent.trim(),href:a.href}));
                  const style=getComputedStyle(paragraphs[0]);
                  return {
                    heading:document.querySelector('#story-title')?.textContent.trim(),
                    paragraphCount:paragraphs.length,
                    earlyRoots:paragraphs[0]?.textContent.includes('entrepreneurial family') && paragraphs[0]?.textContent.includes('early teens'),
                    earlyResponsibility:paragraphs[1]?.textContent.includes('At 18') && paragraphs[2]?.textContent.includes('lean startup environment'),
                    burnout:paragraphs[3]?.textContent.includes('burnt out'),
                    recovery:paragraphs[4]?.textContent.includes('human-centred'),
                    aiShift:paragraphs[5]?.textContent.includes('generative AI'),
                    subsequentWork:paragraphs[6]?.textContent.includes('KRING'),
                    currentWork:paragraphs[7]?.textContent.includes("building ventures again"),
                    storyTop:story?.getBoundingClientRect().top + scrollY,
                    skillsTop:skills?.getBoundingClientRect().top + scrollY,
                    heroBottom:hero?.getBoundingClientRect().bottom + scrollY,
                    fontSize:parseFloat(style.fontSize),
                    externalLinks,
                    ctaMetrics:(() => {
                      const span=document.querySelector('#story .about-story-link span');
                      const box=span.getBoundingClientRect();
                      return { height:box.height, fontSize:parseFloat(getComputedStyle(span).fontSize), text:span.textContent.trim() };
                    })(),
                    bodyOverflow:document.documentElement.scrollWidth>innerWidth+1
                  };
                });
                console.log('About chronology and concrete proof',width,aboutProof);
                const aboutType=await page.evaluate(()=>({
                  h1:parseFloat(getComputedStyle(document.querySelector('.about-personal-copy h1')).fontSize),
                  h2:parseFloat(getComputedStyle(document.querySelector('.about-story-intro h2')).fontSize),
                  lead:parseFloat(getComputedStyle(document.querySelector('.about-personal-lead')).fontSize),
                  leadFamily:getComputedStyle(document.querySelector('.about-personal-lead')).fontFamily,
                  skills:[...document.querySelectorAll('.about-skill-grid h3')].map(e=>e.textContent.trim())
                }));
                assert.ok(Math.abs(aboutType.h1-homepageTypography.h1)<.2,'About H1 matches homepage');
                assert.ok(Math.abs(aboutType.h2-homepageTypography.h2)<.2,'About H2 matches homepage');
                assert.ok(Math.abs(aboutType.lead-homepageTypography.lead)<.2 && aboutType.leadFamily===homepageTypography.leadFamily,'About lead matches homepage font');
                assert.deepEqual(aboutType.skills,['Agentic AI & Strategy','Strategic Innovation','Business Development','Product Development','Market Validation & GTM','Strategic Leadership']);
                const aboutSubtitleWidths=await page.evaluate(()=>[...document.querySelectorAll('.about-personal-lead, .about-home-lead > p, .about-principles-intro > p')].map(el=>({
                  text:el.textContent.trim(),
                  width:el.getBoundingClientRect().width
                })));
                assert.ok(aboutSubtitleWidths.length>=4,'About subtitles should all be included');
                for(const entry of aboutSubtitleWidths) assert.ok(entry.width<=390.5,'About subtitle must stay within shared 390px measure: '+entry.text);
                assert.equal(aboutProof.heading,'The story so far.');
                assert.equal(aboutProof.paragraphCount,8);
                assert.ok(aboutProof.earlyRoots && aboutProof.earlyResponsibility && aboutProof.burnout && aboutProof.recovery && aboutProof.aiShift && aboutProof.subsequentWork && aboutProof.currentWork);
                assert.ok(aboutProof.skillsTop >= aboutProof.heroBottom - 1 && aboutProof.storyTop > aboutProof.skillsTop,'Current About order keeps skills before story');
                assert.deepEqual(aboutProof.externalLinks,[]);
                assert.equal(aboutProof.ctaMetrics.text,'View my LinkedIn profile');
                assert.ok(aboutProof.ctaMetrics.height <= aboutProof.ctaMetrics.fontSize*1.5,
                  'LinkedIn link stays on one rendered line without shrinking or clipping');
                assert.ok(Math.abs(aboutProof.fontSize-(width<=760?17:18))<.1);
                assert.equal(aboutProof.bodyOverflow,false);
                if(width===390||width===1440) await page.locator('#story').screenshot({path:`/tmp/ak-browser-check/about-story-${width}.png`});
                await page.goto('https://augustkring.github.io/humamap-preview/augustkring/perspectives/',{waitUntil:'networkidle',timeout:45000});
                await page.evaluate(() => document.fonts.ready);
                const perspectivesType=await page.evaluate(()=>({
                  h1:parseFloat(getComputedStyle(document.querySelector('.perspectives-hero h1')).fontSize),
                  h2:parseFloat(getComputedStyle(document.querySelector('.perspectives-latest-label')).fontSize),
                  lead:parseFloat(getComputedStyle(document.querySelector('.perspectives-hero > p')).fontSize),
                  intro:document.querySelector('.perspectives-hero > p').textContent.trim(),
                  hasConsentNotice:!!document.querySelector('#newsletter-consent'),
                  email:document.querySelector('.perspectives-newsletter-form input[name="email"]')?.name,
                  privacy:!!document.querySelector('.home-footer a[href="privacy/"]'),
                  overflow:document.documentElement.scrollWidth>innerWidth+1,
                  heroCentred:(() => {
                    const r=document.querySelector('.perspectives-hero').getBoundingClientRect();
                    const m=document.querySelector('.home-main').getBoundingClientRect();
                    return getComputedStyle(document.querySelector('.perspectives-hero')).textAlign==='center' &&
                      Math.abs((r.left+r.right)/2-(m.left+m.right)/2)<1.5;
                  })(),
                  introCentred:(() => {
                    const r=document.querySelector('.perspectives-hero > p').getBoundingClientRect();
                    const m=document.querySelector('.perspectives-hero').getBoundingClientRect();
                    return Math.abs((r.left+r.right)/2-(m.left+m.right)/2)<1.5;
                  })(),
                  formCentred:(() => {
                    const r=document.querySelector('.perspectives-newsletter-form').getBoundingClientRect();
                    const m=document.querySelector('.perspectives-hero').getBoundingClientRect();
                    return Math.abs((r.left+r.right)/2-(m.left+m.right)/2)<1.5;
                  })(),
                  libraryCentred:(() => {
                    const r=document.querySelector('.perspectives-library').getBoundingClientRect();
                    const m=document.querySelector('.home-main').getBoundingClientRect();
                    return Math.abs((r.left+r.right)/2-(m.left+m.right)/2)<1.5;
                  })()
                }));
                assert.ok(Math.abs(perspectivesType.h1-homepageTypography.h1)<.2,'Perspectives H1 matches homepage');
                assert.ok(Math.abs(perspectivesType.h2-homepageTypography.h2)<.2,'Perspectives H2 matches homepage');
                assert.ok(Math.abs(perspectivesType.lead-homepageTypography.lead)<.2,'Perspectives lead matches homepage');
                assert.equal(perspectivesType.intro,'Ideas, observations and questions I write down to understand better, and share when they might be useful to others.');
                assert.ok(!perspectivesType.hasConsentNotice && perspectivesType.email==='email' && perspectivesType.privacy && !perspectivesType.overflow,'Form accessible and footer privacy preserved');
                assert.ok(perspectivesType.heroCentred && perspectivesType.introCentred && perspectivesType.formCentred && perspectivesType.libraryCentred,'Perspectives stays centred at every viewport');
                if(width===390||width===1440) await page.locator('.perspectives-hero').screenshot({path:`/tmp/ak-browser-check/perspectives-page-${width}.png`});
                await page.close();
              }
            } finally {await browser.close();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE

      - name: Audit real browser reading sizes and reflow across pages
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" NODE_PATH=/tmp/ak-browser-check/node_modules node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright-core');
          const base = 'https://augustkring.github.io/humamap-preview/augustkring/';
          const cases = [
            { path: '', selector: '.thread-copy p', desktop: 18, mobile: 17 },
            { path: '', selector: '.waymaking-copy p', desktop: 18, mobile: 16 },
            { path: '', selector: '.perspective-copy > p:not(.perspective-statement)', desktop: 18, mobile: 17 },
            { path: '', selector: '.work-card p', desktop: 16, mobile: 16 },
            { path: 'about/', selector: '.about-skill-grid p', desktop: 16, mobile: 16 },
            { path: 'about/', selector: '.about-personality-meaning p', desktop: 16, mobile: 16 },
            { path: 'about/', selector: '.about-story-content p', desktop: 18, mobile: 17 },
            { path: 'perspectives/', selector: '.perspectives-hero > p', desktop: 19, mobile: 18 },
            { path: 'perspectives/', selector: '.perspective-index-summary', desktop: 17, mobile: 17 },
            { path: 'perspectives/rethinking-the-company/', selector: '.article-prose > p:not(.article-lead)', desktop: 18, mobile: 17 },
            { path: 'perspectives/rethinking-the-company/', selector: '.article-comparison td', desktop: 16, mobile: 16 },
            { path: 'perspectives/europe-at-a-crossroads/', selector: '.article-prose > p:not(.article-lead)', desktop: 18, mobile: 17 },
            { path: 'privacy/', selector: '.legal-content p', desktop: 18, mobile: 17 },
          ];
          (async () => {
            const browser = await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox']});
            try {
              for (const width of [320,390,768,1024,1440]) {
                const page = await browser.newPage({ viewport: {width,height:940}});
                const visited = new Set();
                for (const target of cases) {
                  if (!visited.has(target.path)) {
                    await page.goto(base + target.path, { waitUntil: 'networkidle', timeout: 45000 });
                    await page.evaluate(() => document.fonts.ready);
                    visited.add(target.path);
                  }
                  const metrics = await page.locator(target.selector).first().evaluate(element => {
                    const css=getComputedStyle(element);
                    const rect=element.getBoundingClientRect();
                    return {
                      fontSize:parseFloat(css.fontSize),
                      lineHeight:parseFloat(css.lineHeight),
                      width:rect.width,
                      height:rect.height,
                      viewportOverflow:document.documentElement.scrollWidth>innerWidth+1
                    };
                  });
                  const expected=width<=760?target.mobile:target.desktop;
                  console.log('Typography',width,target.path||'home',target.selector,metrics);
                  assert.ok(Math.abs(metrics.fontSize-expected)<0.1, `Expected ${expected}px for ${target.selector} at ${width}`);
                  assert.ok(metrics.lineHeight/metrics.fontSize >= 1.45, `Readable line height for ${target.selector}`);
                  assert.ok(metrics.width>0&&metrics.height>0, `Text block is visible: ${target.selector}`);
                  assert.equal(metrics.viewportOverflow,false,`No horizontal scrolling on ${target.path} at ${width}px`);
                }
                for (const route of ['','about/','perspectives/rethinking-the-company/']) {
                  await page.goto(base + route, {waitUntil:'networkidle',timeout:45000});
                  await page.evaluate(() => document.fonts.ready);
                  if (width===390||width===1440) {
                    const section=route===''?'.thread-section':route==='about/'?'.about-skills':'.article-layout';
                    await page.locator(section).first().screenshot({path:`/tmp/ak-browser-check/typography-${route.replaceAll('/','-')||'home'}-${width}.png`});
                  }
                  // Representative 200%-sized prose at narrow viewports checks text
                  // growth and wrapping; this is not a complete WCAG conformance audit.
                  if (width===390) {
                    const selected=route===''?'.thread-copy p':route==='about/'?'.about-skill-grid p':'.article-prose > p:not(.article-lead)';
                    await page.locator(selected).first().evaluate(e=>{e.style.fontSize='34px';e.style.lineHeight='1.5';});
                    assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1),false,`Scaled text must reflow on ${route||'home'}`);
                  }
                }
                await page.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE

      - name: Save responsive sign-off and mobile navigation screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: augustkring-signoff-responsive
          path: |
            /tmp/ak-browser-check/signoff-*.png
            /tmp/ak-browser-check/contact-*.png
            /tmp/ak-browser-check/menu-open-*.png
            /tmp/ak-browser-check/perspectives-*.png
            /tmp/ak-browser-check/focus-heading-*.png
            /tmp/ak-browser-check/waymaking-*.png
            /tmp/ak-browser-check/creative-start-*.png
            /tmp/ak-browser-check/road-clean-exit-*.png
            /tmp/ak-browser-check/typography-*.png
            /tmp/ak-browser-check/about-story-*.png
            /tmp/ak-browser-check/perspectives-page-*.png
          if-no-files-found: warn
          retention-days: 7
