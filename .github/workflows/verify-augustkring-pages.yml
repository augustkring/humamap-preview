name: Verify August Kring GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "augustkring/index.html"
      - "augustkring/styles.css"
      - "augustkring/work-carousel.js"
      - "augustkring/assets/waymaking-vector-road-desktop-v15.svg"
      - "augustkring/assets/waymaking-vector-road-mobile-v15.svg"
      - "augustkring/assets/waymaking-ink-road-brush.png"
      - "augustkring/assets/waymaking-ink-road-brush-mobile.png"
      - "augustkring/assets/waymaking-editorial-ink.avif"
      - "augustkring/assets/waymaking-editorial-ink.webp"
      - "augustkring/assets/waymaking-brush-head-v24.png"
      - "augustkring/assets/waymaking-ink-v25.webp"
      - "augustkring/waymaking-scroll.js"
      - "augustkring/assets/waymaking-dry-brush.png"
      - "augustkring/assets/waymaking-dry-brush-LICENSE.txt"
      - "augustkring/verify-baseline.mjs"
      - "augustkring/verify-about-layout.cjs"
      - "augustkring/verify-perspectives-index.cjs"
      - "augustkring/verify-mobile-type.cjs"
      - "augustkring/EDITORIAL_DESIGN_BASELINE.md"
      - "augustkring/mobile-nav.js"
      - "augustkring/about/index.html"
      - "augustkring/perspectives/index.html"
      - "augustkring/perspectives/rethinking-the-company/index.html"
      - "augustkring/perspectives/europe-at-a-crossroads/index.html"
      - "augustkring/privacy/index.html"
      - "augustkring/unsubscribe/index.html"
      - ".github/workflows/verify-augustkring-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved site baseline
        uses: actions/checkout@v4
      - name: Check locked homepage and shared design
        run: node augustkring/verify-baseline.mjs
      - name: Wait for published HTML and verify deployed CSS
        shell: bash
        run: |
          set -euo pipefail
          trap 'printf "::error::Published check failed at line %s: %s\n" "$LINENO" "$BASH_COMMAND"' ERR
          base="https://augustkring.github.io/humamap-preview/augustkring/"
          expected_home="styles.css?v=20261027-shared-v19"
          expected_shared="styles.css?v=20261027-shared-v19"
          expected_copy="build towards a positive future together with bold people"
          for attempt in $(seq 1 24); do
            status="$(curl -sSL --max-time 15 -o /tmp/augustkring.html -w '%{http_code}' "${base}?verification=${GITHUB_SHA}" || true)"
            echo "Attempt ${attempt}: public HTML HTTP ${status}"
            if [ "$status" = "200" ] && grep -Fq "$expected_home" /tmp/augustkring.html && grep -Fq "$expected_copy" /tmp/augustkring.html && grep -Fq "Waymaking Ventures builds businesses" /tmp/augustkring.html && grep -Fq '<h3>Creative Thinking</h3>' /tmp/augustkring.html && grep -Fq '<h3>Commercial Understanding</h3>' /tmp/augustkring.html && grep -Fq '<h3>Strategic Judgement</h3>' /tmp/augustkring.html && grep -Fq '<h3>Hands-On Execution</h3>' /tmp/augustkring.html && grep -Fq '<h3>Purpose &amp; Impact</h3>' /tmp/augustkring.html; then
              echo "Approved editorial Waymaking homepage and stylesheet are published."
              break
            fi
            if [ "$attempt" = "24" ]; then echo "::error::Public HTML is not updated"; exit 1; fi
            sleep 10
          done
          grep -Fq "Exploring how AI and human-centric innovation can make businesses more adaptive, resilient and sustainable." /tmp/augustkring.html
          grep -Fq '<h2 id="thread-title">Where I add value</h2>' /tmp/augustkring.html
          grep -Fq "But greater capacity doesn't automatically make a company more competitive. AI raises the stakes: it amplifies the value of what a company gets right and the cost of what it gets wrong." /tmp/augustkring.html
          grep -Fq 'build towards a positive future together with bold people' /tmp/augustkring.html
          grep -Fq '<span>Connect on LinkedIn</span><svg class="arrow arrow-up-right"' /tmp/augustkring.html
          grep -Fq '<span>Email me</span><svg class="arrow arrow-up-right"' /tmp/augustkring.html
          grep -Fq 'href="mailto:ak@augustkring.com"' /tmp/augustkring.html
          grep -Fq '<h2 id="work-title">My current focus</h2>' /tmp/augustkring.html
          grep -Fq 'aria-label="Waymaking" data-waymaking-story' /tmp/augustkring.html
          grep -Fq 'class="waymaking-copy-column" role="list"' /tmp/augustkring.html
          test "$(grep -Fc 'role="listitem"' /tmp/augustkring.html)" -eq 5
          ! grep -Fq 'waymaking-signature' /tmp/augustkring.html
          ! grep -Fq 'What I mean by Waymaker' /tmp/augustkring.html
          ! grep -Fq 'waymaking-scroll.js' /tmp/augustkring.html
          ! grep -Fq 'waymaking-road-wrap' /tmp/augustkring.html
          ! grep -Fq 'waymaking-artspace' /tmp/augustkring.html
          grep -Fq 'Purpose &amp; Impact</h3>' /tmp/augustkring.html
          grep -Fq 'Hands-On Execution</h3>' /tmp/augustkring.html
          grep -Fq 'customer value, sound economics' /tmp/augustkring.html
          grep -Fq 'Strategic Judgement</h3>' /tmp/augustkring.html
          ! grep -Fq "How that shows up in what I'm building today." /tmp/augustkring.html
          ! grep -Fq "What I'm building and working on today." /tmp/augustkring.html
          grep -Fq "Blentera gives companies a shared foundation for AI." /tmp/augustkring.html
          grep -Fq 'Read my perspectives' /tmp/augustkring.html
          ! grep -Fq 'Explore my perspectives' /tmp/augustkring.html
          ! grep -Fq 'class="perspective-links"' /tmp/augustkring.html
          ! grep -Fq 'The next decade will test even the strongest market positions.' /tmp/augustkring.html
          ! grep -Fq 'waymaking-ventures' /tmp/augustkring.html
          ! grep -Fq '<sup>™</sup>' /tmp/augustkring.html
          ! grep -Fq 'Let’s connect' /tmp/augustkring.html
          grep -Fq '<p class="signoff-note">With curiosity and optimism,</p>' /tmp/augustkring.html
          grep -Fq 'data-work-pagination' /tmp/augustkring.html
          grep -Fq 'data-work-label="Waymaking"' /tmp/augustkring.html
          ! grep -Fq 'data-work-prev' /tmp/augustkring.html
          ! grep -Fq 'data-work-next' /tmp/augustkring.html
          grep -Fq 'src="work-carousel.js?v=20261026-dots-v1"' /tmp/augustkring.html
          ! grep -Fq '<h2 id="about-title">My story</h2>' /tmp/augustkring.html
          grep -Fq '<p class="signoff-name">August Kring</p>' /tmp/augustkring.html
          grep -Fq 'class="signoff-signature"' /tmp/augustkring.html
          grep -Fq 'src="mobile-nav.js?v=20261026-dark-focus-v5"' /tmp/augustkring.html
          curl -fsSL --max-time 20 "${base}${expected_home}" -o /tmp/augustkring.css
          grep -Fq 'text-wrap: wrap;' /tmp/augustkring.css
          grep -Fq '.mobile-menu-toggle:focus-visible svg' /tmp/augustkring.css
          grep -Fq 'stroke-width: 2.35;' /tmp/augustkring.css
          ! grep -Fq '.mobile-menu-close:focus-visible { outline: 2px solid var(--red)' /tmp/augustkring.css
          grep -Fq '/* Waymaking editorial: five parallel facets, hierarchy before decoration. */' /tmp/augustkring.css
          grep -Fq 'grid-template-columns: minmax(0, .82fr) minmax(0, 1.18fr);' /tmp/augustkring.css
          grep -Fq '.waymaking-beat + .waymaking-beat {' /tmp/augustkring.css
          grep -Fq 'border-top: 1px solid var(--line);' /tmp/augustkring.css
          grep -Fq 'font-size: clamp(21px, calc(2vw - 2px), 26px);' /tmp/augustkring.css
          grep -Fq 'font-size: var(--card-copy-size);' /tmp/augustkring.css
          ! grep -Fq '.waymaking-signature' /tmp/augustkring.css
          grep -Fq '@media (max-width: 700px) {' /tmp/augustkring.css
          ! grep -Fq '.waymaking-road-wrap' /tmp/augustkring.css
          ! grep -Fq '.waymaking-artspace' /tmp/augustkring.css
          ! grep -Fq '.waymaking-beat:nth-child(odd)' /tmp/augustkring.css
          curl -fsSL --max-time 20 "${base}assets/blentera-horizontal-color.svg" -o /dev/null
          grep -Fq '.personal-signoff .signoff-name {' /tmp/augustkring.css
          grep -Fq '.personal-signoff .signoff-signature {' /tmp/augustkring.css
          grep -Fq 'scrollbar-gutter: stable;' /tmp/augustkring.css
          grep -Fq 'width: clamp(186px, 17vw, 198px);' /tmp/augustkring.css
          grep -Fq '.work-carousel-dot[aria-current="true"]' /tmp/augustkring.css
          grep -Fq '.work-brand-august { height: 40px; }' /tmp/augustkring.css
          grep -Fq '.work-brand-humamap { height: 40px; }' /tmp/augustkring.css
          grep -Fq 'width: .54em; height: .54em;' /tmp/augustkring.css
          grep -Fq 'width: .70em; height: .62em;' /tmp/augustkring.css
          grep -Fq -- '--body-copy-size: 18px;' /tmp/augustkring.css
          grep -Fq -- '--body-reading-size: 18px;' /tmp/augustkring.css
          grep -Fq -- '--card-copy-size: 17px;' /tmp/augustkring.css
          grep -Fq '.homepage-contact-content { display: block; }' /tmp/augustkring.css
          grep -Fq -- '--about-section-space: var(--section-space);' /tmp/augustkring.css
          grep -Fq '.waymaking-beat:last-child {' /tmp/augustkring.css
          grep -Fq 'padding-top: var(--section-space);' /tmp/augustkring.css
          grep -Fq 'width: 44px;' /tmp/augustkring.css
          curl -fsSL --max-time 20 "${base}assets/august-signature-vector-fine.svg?v=20261009-fine-ink-v1" -o /tmp/august-signature.svg
          grep -Fq 'viewBox="0 0 340 314"' /tmp/august-signature.svg
          grep -Fq '<path d=' /tmp/august-signature.svg
          ! grep -Eq '<(script|image|foreignObject)' /tmp/august-signature.svg
          curl -fsSL --max-time 20 "${base}work-carousel.js?v=20261026-dots-v1" -o /tmp/augustkring-work-carousel.js
          grep -Fq "dot.dataset.workDot = ''" /tmp/augustkring-work-carousel.js
          grep -Fq "aria-current" /tmp/augustkring-work-carousel.js
          grep -Fq "prefers-reduced-motion" /tmp/augustkring-work-carousel.js
          curl -fsSL --max-time 20 "${base}mobile-nav.js?v=20261026-dark-focus-v5" -o /tmp/augustkring-mobile-nav.js
          grep -Fq 'dialog.focus({ preventScroll: true })' /tmp/augustkring-mobile-nav.js
          grep -Fq "!root.hasAttribute('data-nav-pointer')" /tmp/augustkring-mobile-nav.js
          grep -Fq 'opener.blur()' /tmp/augustkring-mobile-nav.js
          ! grep -Fq 'document.body.style.position' /tmp/augustkring-mobile-nav.js
          for route in about/ perspectives/ perspectives/rethinking-the-company/ perspectives/europe-at-a-crossroads/ privacy/ unsubscribe/; do
            curl -fsSL --max-time 20 "${base}${route}" -o /tmp/augustkring-subpage.html
            grep -Fq "$expected_shared" /tmp/augustkring-subpage.html
            grep -Fq 'src="mobile-nav.js?v=20261026-dark-focus-v5"' /tmp/augustkring-subpage.html
          done
          for attempt in $(seq 1 30); do
            curl -fsSL --max-time 20 "${base}about/?verification=${GITHUB_SHA}" -o /tmp/augustkring-about.html
            if grep -Fq '<h1 id="about-page-title">Hi, I’m August.</h1>' /tmp/augustkring-about.html && grep -Fq 'I believe the future is shaped by what we choose to build together.' /tmp/augustkring-about.html && grep -Fq '<h2 id="story-title">My story.</h2>' /tmp/augustkring-about.html && grep -Fq '<h3>Entrepreneurial</h3>' /tmp/augustkring-about.html && grep -Fq '<h3>Connective</h3>' /tmp/augustkring-about.html && grep -Fq '<h2 id="principles-title">Principles.</h2>' /tmp/augustkring-about.html && grep -Fq '<h3>Think big. Start small. Scale fast.</h3>' /tmp/augustkring-about.html && grep -Fq '<h3>People, planet &amp; profit.</h3>' /tmp/augustkring-about.html; then
              echo "The About V7 belief, mindset and principles revision is published."
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::GitHub Pages has not yet published the About V7 revision"
              exit 1
            fi
            sleep 10
          done
          curl -fsSL --max-time 20 "${base}perspectives/?verification=${GITHUB_SHA}" -o /tmp/augustkring-perspectives.html
          grep -Fq 'AI advantage will depend less on how many tools a company adopts and more on how deeply it redesigns itself around what AI makes possible.' /tmp/augustkring-perspectives.html
          grep -Fq 'Europe should not define success in the AI era only by whether it wins the frontier-model race. A major opportunity lies in turning AI into productive, resilient and human-centric companies.' /tmp/augustkring-perspectives.html
          ! grep -Fq 'Read perspective' /tmp/augustkring-perspectives.html
          grep -Fq 'class="perspective-index-summary"' /tmp/augustkring-perspectives.html
          echo "Published Perspectives excerpts use the exact article introductions with no duplicate CTA."
          echo "Published hero, signature+name, shared mobile menu and CSS are consistent across pages."

      - name: Check hero text rendering in desktop and mobile Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "::error::Chrome not installed"; exit 1; }
          mkdir -p /tmp/ak-browser-check
          npm install --prefix /tmp/ak-browser-check --no-audit --no-fund --silent playwright-core@1.55.0
          CHROME_BIN="$chrome" NODE_PATH=/tmp/ak-browser-check/node_modules node <<'NODE'
          const assert = require('node:assert/strict');
          const {chromium} = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({executablePath:process.env.CHROME_BIN, headless:true, args:['--no-sandbox']});
            try {
              for (const width of [320, 390, 768, 1024, 1440]) {
                const page = await browser.newPage({viewport:{width,height:900}});
                await page.goto('https://augustkring.github.io/humamap-preview/augustkring/', {waitUntil:'networkidle',timeout:45000});
                await page.evaluate(() => document.fonts.ready);
                const metrics = await page.evaluate(() => {
                  const copy=document.querySelector('.hero-copy');
                  const focus=document.querySelector('.hero-focus');
                  const title=document.querySelector('#hero-title');
                  const style=getComputedStyle(focus);
                  const size=focus.getBoundingClientRect();
                  const lineHeight=parseFloat(style.lineHeight);
                  return {
                    copyWidth:copy.getBoundingClientRect().width,
                    focusWidth:size.width,
                    titleWidth:title.getBoundingClientRect().width,
                    roleWidth:document.querySelector('.hero-role').getBoundingClientRect().width,
                    maxWidth:style.maxWidth,
                    textWrap:style.textWrap,
                    textOverflow:style.textOverflow,
                    overflow:style.overflow,
                    approximateLines: Math.round(size.height/lineHeight),
                    horizontalOverflow:document.documentElement.scrollWidth>innerWidth+1,
                    isVisible:size.width>0&&size.height>0
                  };
                });
                console.log('Hero rendering',width,metrics);
                assert.equal(metrics.maxWidth,'none','No arbitrary fixed max-width');
                assert.equal(metrics.textWrap,'wrap','Hero paragraph uses full natural line measure');
                assert.ok(Math.abs(metrics.focusWidth-metrics.copyWidth)<2,'Exploring description fills the entire hero column');
                assert.ok(Math.abs(metrics.roleWidth-metrics.copyWidth)<2,'Role text has the same hero width');
                assert.ok(Math.abs(metrics.titleWidth-metrics.copyWidth)<2,'Heading has the same hero width');
                assert.equal(metrics.horizontalOverflow,false,'No horizontal viewport overflow');
                assert.equal(metrics.isVisible,true,'Hero paragraph visible');
                assert.ok(metrics.approximateLines<= (width<600 ? 6:width<900 ? 4:3), 'Hero description uses reasonable line count');
                assert.equal((await page.locator('.hero-focus').textContent()).trim(), 'Exploring how AI and human-centric innovation can make businesses more adaptive, resilient and sustainable.');
                const homepageTypography=await page.evaluate(() => {
                  const dot=document.querySelector('.wordmark-i');
                  const after=getComputedStyle(dot,'::after');
                  const before=getComputedStyle(dot,'::before');
                  const wordmark=getComputedStyle(document.querySelector('.header-wordmark'));
                  return {
                    h1:parseFloat(getComputedStyle(document.querySelector('.hero-copy h1')).fontSize),
                    h2:parseFloat(getComputedStyle(document.querySelector('.thread-lead h2')).fontSize),
                    sectionSpace:parseFloat(getComputedStyle(document.querySelector('.story-section')).paddingTop),
                    lead:parseFloat(getComputedStyle(document.querySelector('.hero-focus')).fontSize),
                    leadFamily:getComputedStyle(document.querySelector('.hero-focus')).fontFamily,
                    wordmarkFontSize:parseFloat(wordmark.fontSize),
                    wordmarkDotWidth:parseFloat(after.width),
                    wordmarkDotHeight:parseFloat(after.height),
                    wordmarkDotTop:parseFloat(after.top),
                    wordmarkBeforeContent:before.content,
                    wordmarkBeforeBackground:before.backgroundColor
                  };
                });
                const dotRatio=homepageTypography.wordmarkDotWidth/homepageTypography.wordmarkFontSize;
                const dotBottomRatio=(homepageTypography.wordmarkDotTop+homepageTypography.wordmarkDotHeight)/homepageTypography.wordmarkFontSize;
                assert.ok(dotRatio>=.40&&dotRatio<=.41,'Wordmark red dot must render at the approved .405em diameter');
                assert.ok(homepageTypography.wordmarkDotTop<0,'Wordmark dot must sit above the i');
                assert.ok(dotBottomRatio>=.295&&dotBottomRatio<=.305,'Wordmark dot lower edge must preserve the original .30em optical spacing');
                assert.ok(homepageTypography.wordmarkBeforeContent==='none'||homepageTypography.wordmarkBeforeContent==='normal','Wordmark must not render a white ::before halo');
                assert.ok(homepageTypography.wordmarkBeforeBackground==='rgba(0, 0, 0, 0)'||homepageTypography.wordmarkBeforeBackground==='transparent','Wordmark halo background must be transparent');
                const editorial = await page.evaluate(() => {
                  const statement = document.querySelector('.perspective-statement');
                  const readPerspectives = document.querySelector('.perspective-read-link');
                  return {
                    opener: document.querySelector('.thread-copy p:first-child').textContent.trim(),
                    visionCopy: document.querySelector('.thread-copy p:nth-child(2)').textContent.trim(),
                    purposeCopy: document.querySelector('.thread-copy p:nth-child(3)').textContent.trim(),
                    purposeTitle: document.querySelector('.waymaking-purpose h3').textContent.trim(),
                    workHeading: document.querySelector('#work-title').textContent.trim(),
                    waymakingTitle: document.querySelector('.waymaking-narrative').getAttribute('aria-label'),
                    hasWaymakerConclusion: !!document.querySelector('.waymaking-resolution'),
                    waymakingBeatCount: document.querySelectorAll('.waymaking-beat').length,
                    hasHomepageStory: !!document.querySelector('#about-title'),
                    statementTypeface: getComputedStyle(statement).fontFamily,
                    statementWeight: getComputedStyle(statement).fontWeight,
                    statementText: statement.textContent.trim(),
                    readPerspectives: readPerspectives?.textContent.trim(),
                    hasPerspectivePreviews: !!document.querySelector('.perspective-links'),
                    hasWorkSubtitle: !!document.querySelector('.work-heading-copy > p'),
                    bodyOverflow: document.documentElement.scrollWidth > innerWidth + 1
                  };
                });
                console.log('Editorial polish', width, editorial);
                assert.equal(editorial.opener,'I do my best work when something new is taking shape or a challenge calls for fresh thinking and clear direction. I combine creative thinking with commercial understanding and strategic judgement to spot opportunities and find better ways forward.');
                const shiftStatementWidth=await page.locator('.perspective-lead > .perspective-statement').evaluate(el=>el.getBoundingClientRect().width);
                assert.ok(shiftStatementWidth<=390.5,'The Shift I See statement must stay within the shared editorial measure');
                if(width===1440) {
                  const summary = await page.locator('.thread-copy p:first-child').evaluate(el => ({
                    width: el.getBoundingClientRect().width,
                    height: el.getBoundingClientRect().height,
                    lineHeight: parseFloat(getComputedStyle(el).lineHeight)
                  }));
                  assert.ok(summary.width>=350&&summary.width<=640,'Holistic introduction should have a comfortable reading width');
                  assert.ok(summary.height>summary.lineHeight*2,'Holistic introduction should remain a readable paragraph');
                }
                assert.equal(editorial.visionCopy,"I enjoy giving ambitious ideas direction and bringing people together around a shared vision. But I also like getting hands-on, experimenting and building things myself, using AI to turn ideas into reality.");
                assert.equal(editorial.purposeCopy,"What drives me is building towards a positive future together with bold people: creating things that matter and leaving the world a little better than I found it.");
                assert.equal(editorial.purposeTitle,'Purpose & Impact');
                assert.equal((await page.locator('.perspective-copy > p').nth(2).textContent()).trim(),"But greater capacity doesn't automatically make a company more competitive. AI raises the stakes: it amplifies the value of what a company gets right and the cost of what it gets wrong.");
                assert.equal(editorial.workHeading,'My current focus');
                assert.equal(editorial.waymakingTitle,'Waymaking');
                assert.equal(await page.locator('#waymaking-title').count(),0,'The visible introductory Waymaking heading must be removed');
                assert.equal(editorial.hasWaymakerConclusion,false,'Redundant Waymaker conclusion must be removed');
                assert.equal(editorial.waymakingBeatCount,5);
                if(width<=840) {
                  await page.locator('[data-mobile-nav-open]').click();
                  const link=page.locator('.mobile-navigation-panel a').first();
                  const tap=await link.evaluate(el=>getComputedStyle(el).webkitTapHighlightColor);
                  assert.ok(/(?:rgba\(0,\s*0,\s*0,\s*0\)|transparent)/.test(tap),
                    'Dark Safari tap overlay still present: '+tap);
                  await page.locator('[data-mobile-nav-close]').click();
                  const closedToggle=await page.locator('[data-mobile-nav-open]').evaluate(el=>({
                    color:getComputedStyle(el).color,
                    outlineStyle:getComputedStyle(el).outlineStyle,
                    outlineWidth:getComputedStyle(el).outlineWidth,
                    boxShadow:getComputedStyle(el).boxShadow,
                    focused:document.activeElement===el
                  }));
                  assert.equal(closedToggle.color,'rgb(11, 34, 61)','Closed burger must stay dark');
                  assert.ok(closedToggle.outlineStyle==='none'||closedToggle.outlineWidth==='0px','Closed burger must never keep an outline');
                  assert.equal(closedToggle.boxShadow,'none','Closed burger must never keep a focus shadow');
                  assert.equal(closedToggle.focused,false,'Pointer-close must not leave focus on the burger');
                }
                assert.equal(editorial.hasHomepageStory,false);
                const waymaking=await page.evaluate(()=>{
                  const section=document.querySelector('.waymaking-narrative');
                  const beats=[...document.querySelectorAll('.waymaking-beat')];
                  const box=el=>{
                    const b=el.getBoundingClientRect();
                    return {top:b.top,left:b.left,right:b.right,bottom:b.bottom,width:b.width,height:b.height};
                  };
                  return {
                    titles:beats.map(x=>x.querySelector('h3').textContent.trim()),
                    overflow:document.documentElement.scrollWidth>innerWidth+1,
                    hasRoad:!!document.querySelector('.waymaking-road-wrap,.waymaking-artspace,.waymaking-original-reveal'),
                    hasRoadScript:[...document.scripts].some(x=>x.src.includes('waymaking-scroll.js')),
                    section:box(section),
                    rows:beats.map(x=>{
                      const copy=x.querySelector('.waymaking-copy');
                      const heading=x.querySelector('h3');
                      const paragraph=x.querySelector('p');
                      return {
                        row:box(x),heading:box(heading),paragraph:box(paragraph),
                        display:getComputedStyle(copy).display,
                        borderTop:parseFloat(getComputedStyle(x).borderTopWidth),
                        headingSize:parseFloat(getComputedStyle(heading).fontSize),
                        bodySize:parseFloat(getComputedStyle(paragraph).fontSize)
                      };
                    })
                  };
                });
                assert.deepEqual(waymaking.titles,[
                  'Creative Thinking','Commercial Understanding','Strategic Judgement',
                  'Hands-On Execution','Purpose & Impact'
                ]);
                assert.equal(waymaking.hasRoad,false,'Retired central road returned');
                assert.equal(waymaking.hasRoadScript,false,'Retired Waymaking scroll script returned');
                assert.equal(waymaking.overflow,false,'Waymaking creates horizontal overflow');
                const rowHeights=waymaking.rows.map(x=>x.row.height);
                assert.ok(Math.max(...rowHeights)-Math.min(...rowHeights)<=95,'Waymaking row rhythm is too uneven');
                for(const [index,row] of waymaking.rows.entries()){
                  assert.equal(row.display,'grid','Editorial row must use grid');
                  if(index===0) assert.ok(row.borderTop<.5,'First Waymaking row must not have a top divider');
                  else assert.ok(row.borderTop>=.5,'Internal Waymaking hairline divider missing');
                  assert.ok(row.headingSize>=20.9&&row.headingSize<=26.1,'Waymaking heading scale drift');
