name: Generate BLENTERA OSS Source

on:
  push:
    branches:
      - blentera-v2-oss-source
    paths:
      - ".github/workflows/blentera-v2-generate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout host repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate

      - name: Generate exact 7Ovr SaaS Landing source
        run: |
          rm -rf blentera-v2-source/saas-landing
          git clone --depth 1 https://github.com/7Ovr/shadcn-next-starter.git blentera-v2-source/saas-landing
          rm -rf blentera-v2-source/saas-landing/.git
          cd blentera-v2-source/saas-landing
          pnpm install
          pnpm dlx shadcn@latest add @7ovr/saas-landing --yes --overwrite
          pnpm build

      - name: Generate exact 7Ovr SaaS Landing 2 source
        run: |
          rm -rf blentera-v2-source/saas-landing-2
          git clone --depth 1 https://github.com/7Ovr/shadcn-next-starter.git blentera-v2-source/saas-landing-2
          rm -rf blentera-v2-source/saas-landing-2/.git
          cd blentera-v2-source/saas-landing-2
          pnpm install
          pnpm dlx shadcn@latest add @7ovr/saas-landing-2 --yes --overwrite
          pnpm build

      - name: Commit exact open-source sources
        run: |
          git config user.name "BLENTERA OSS Generator"
          git config user.email "actions@github.com"
          git add blentera-v2-source
          git commit -m "chore: vendor exact 7Ovr SaaS templates" || exit 0
          git push origin HEAD:blentera-v2-oss-source
