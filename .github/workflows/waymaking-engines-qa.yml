name: Waymaking cross-browser visual QA

on:
  pull_request:
    paths:
      - "augustkring/**"
      - ".github/workflows/waymaking-engines-qa.yml"
  push:
    branches:
      - main
    paths:
      - "augustkring/**"
      - ".github/workflows/waymaking-engines-qa.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check approved editorial baseline
        run: node augustkring/verify-baseline.mjs
      - name: Run actual firefox,webkit progressive vector road and visual-overlap QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ak-road-site/humamap-preview artifacts
          cp -R augustkring /tmp/ak-road-site/humamap-preview/augustkring
          python3 -m http.server 8765 --directory /tmp/ak-road-site >/tmp/ak-road-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/humamap-preview/augustkring/ >/dev/null && break
            sleep 1
          done
          npm install --prefix /tmp/ak-v13-qa --no-audit --no-fund --silent playwright@1.55.0 pngjs@7.0.0
          /tmp/ak-v13-qa/node_modules/.bin/playwright install --with-deps firefox webkit
          ROAD_BASE=http://127.0.0.1:8765/humamap-preview/augustkring/ ROAD_OUTPUT=artifacts ROAD_ENGINES=firefox,webkit ROAD_WIDTHS=390,1440 NODE_PATH=/tmp/ak-v13-qa/node_modules node augustkring/verify-viewport-road.cjs
      - name: Upload actual-browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waymaking-progressive-v15-firefox,webkit-screenshots
          path: artifacts/
          if-no-files-found: warn
