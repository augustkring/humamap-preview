name: Render faithful signature ink
on:
  push:
    branches: [main]
    paths: [.github/workflows/refresh-signature-ink.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: august-signature-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --no-input 'Pillow==11.3.0'
      - name: Render original ink with continuous alpha for high-density devices
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          source = Path("augustkring/assets/august-signature-authentic.png")
          output = Path("augustkring/assets/august-signature-refined-4x.png")
          original = Image.open(source).convert("RGBA")
          if original.size != (260, 245):
              raise ValueError(f"Unexpected source dimension: {original.size}")
          original_alpha = original.getchannel("A")
          if not original_alpha.getbbox():
              raise ValueError("Original handwriting is empty")

          scale = 4
          high_res = original_alpha.resize(
              (original.width * scale, original.height * scale),
              resample=Image.Resampling.LANCZOS,
          )
          # Retain the original marks and their geometry. Strengthen only the
          # existing semi-transparent ink, which was too faint when downsized.
          high_res = high_res.point(
              lambda value: round(255 * ((value / 255) ** 0.82))
          ).filter(ImageFilter.GaussianBlur(radius=0.22))
          refined = Image.new("RGBA", high_res.size, (11, 34, 61, 0))
          refined.putalpha(high_res)
          refined.save(output, "PNG", optimize=True)
          if refined.getchannel("A").getbbox() is None:
              raise ValueError("Rendering lost the signature")
          if output.stat().st_size > 350000:
              raise ValueError("Unreasonable output size")
          print(f"Preserved ink geometry at {refined.size} in {output.stat().st_size} bytes")
          PY
      - name: Commit final ink asset without overwriting newer site changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add augustkring/assets/august-signature-refined-4x.png
          if ! git diff --cached --quiet; then
            git commit -m "Preserve original signature with continuous high-density ink"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "Identical signature asset already present"
          fi
