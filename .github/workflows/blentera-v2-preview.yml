name: BLENTERA V2 Preview

on:
  push:
    branches:
      - blentera-v2-oss-source
    paths:
      - "blentera-v2-final/**"
      - ".github/workflows/blentera-v2-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.5.1 --activate

      - name: Install exact source dependencies
        working-directory: blentera-v2-final
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        working-directory: blentera-v2-final
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        working-directory: blentera-v2-final
        run: pnpm typecheck

      - name: Lint
        working-directory: blentera-v2-final
        run: pnpm lint

      - name: Production build
        working-directory: blentera-v2-final
        run: pnpm build

      - name: Anonymous Netlify preview deploy
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes netlify-cli@latest deploy \
            --dir=blentera-v2-final/out \
            --no-build \
            --allow-anonymous \
            --created-via blentera-v2-preview \
            --json | tee /tmp/netlify-v2.json

          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("fs");
          const raw = fs.readFileSync("/tmp/netlify-v2.json", "utf8");
          let url = "";
          try {
            const data = JSON.parse(raw);
            url = data.deploy_url || data.url || data.ssl_url || data.site_url || "";
          } catch {}
          if (!url) {
            const matches = raw.match(/https:\/\/[^\s"'<>]+\.netlify\.app[^\s"'<>]*/g) || [];
            url = matches[0] || "";
          }
          if (!url) {
            const matches = raw.match(/http:\/\/[^\s"'<>]+\.netlify\.app[^\s"'<>]*/g) || [];
            url = matches[0] || "";
          }
          if (!url) process.exit(1);
          url = url.replace(/^http:\/\//, "https://");
          console.log("preview_url=" + url);
          console.error("BLENTERA_V2_PREVIEW_URL=" + url);
          NODE

      - name: Route and content smoke tests
        env:
          SITE_URL: ${{ steps.deploy.outputs.preview_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing $SITE_URL"
          for path in / /robots.txt /sitemap.xml /manifest.webmanifest /icon.svg /opengraph-image; do
            code=$(curl -sS -L --retry 4 --retry-delay 2 -o /tmp/body -w "%{http_code}" "$SITE_URL$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          curl -fsSL "$SITE_URL/" | grep -q "Build your company"
          curl -fsSL "$SITE_URL/" | grep -q "One company layer that stays useful"
          curl -fsSL "$SITE_URL/" | grep -q "Stop starting from zero"
          curl -fsSL "$SITE_URL/" | grep -q "€499"

      - name: Install Playwright
        run: |
          mkdir -p /tmp/blentera-v2-qa
          cd /tmp/blentera-v2-qa
          npm init -y >/dev/null
          npm install playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Browser QA desktop and mobile
        env:
          SITE_URL: ${{ steps.deploy.outputs.preview_url }}
        shell: bash
        run: |
          cat > /tmp/blentera-v2-qa/qa.mjs <<'EOF'
          import { chromium } from "playwright";

          const base = process.env.SITE_URL;
          const browser = await chromium.launch();
          const failures = [];

          async function check(viewport, label) {
            const page = await browser.newPage({ viewport });
            const consoleErrors = [];
            const pageErrors = [];
            page.on("console", (m) => { if (m.type() === "error") consoleErrors.push(m.text()); });
            page.on("pageerror", (e) => pageErrors.push(String(e)));

            const response = await page.goto(base + "/", { waitUntil: "networkidle" });
            if (!response || response.status() !== 200) failures.push(label + " status");
            const state = await page.evaluate(() => ({
              overflow: document.documentElement.scrollWidth > window.innerWidth + 2,
              h1s: document.querySelectorAll("h1").length,
              title: document.title,
            }));
            if (state.overflow) failures.push(label + " horizontal overflow");
            if (state.h1s !== 1) failures.push(label + " expected one h1, got " + state.h1s);
            if (!state.title.includes("BLENTERA")) failures.push(label + " title missing BLENTERA");
            if (consoleErrors.length) failures.push(label + " console errors: " + consoleErrors.join(" | "));
            if (pageErrors.length) failures.push(label + " page errors: " + pageErrors.join(" | "));

            if (label === "desktop") {
              await page.getByRole("tab", { name: "Learning", exact: true }).click();
              await page.getByText("AI → software", { exact: true }).waitFor({ state: "visible" });
              await page.getByRole("button", { name: "Review and reuse", exact: true }).click();
              const faq = page.locator('[data-slot="accordion-item"]').first();
              await faq.locator('[data-slot="accordion-trigger"]').click();
            }

            if (label === "mobile") {
              await page.getByRole("button", { name: "Open menu" }).click();
              const product = page.getByRole("link", { name: "Product", exact: true }).first();
              if (!(await product.isVisible())) failures.push("mobile menu Product not visible");
            }

            await page.close();
          }

          await check({ width: 1440, height: 1000 }, "desktop");
          await check({ width: 390, height: 844 }, "mobile");
          await browser.close();

          if (failures.length) {
            console.error("QA FAILURES");
            for (const failure of failures) console.error("- " + failure);
            process.exit(1);
          }

          console.log("Browser QA passed: desktop/mobile, no overflow, one h1, no console/page errors, tabs, stepper, FAQ and mobile menu.");
          EOF
          cd /tmp/blentera-v2-qa
          node qa.mjs

      - name: Publish preview URL
        env:
          SITE_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          echo "BLENTERA V2 passed audit, typecheck, lint, production build, route smoke tests and browser QA."
          echo "PREVIEW_URL=$SITE_URL"
