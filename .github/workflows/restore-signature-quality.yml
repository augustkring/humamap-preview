name: Restore smooth high-density signature

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/restore-signature-quality.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-signature-quality
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout authoritative asset
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processing library
        run: python -m pip install --disable-pip-version-check --no-input "Pillow==11.3.0"

      - name: Smooth and upscale original PNG without tracing
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          source = Path('augustkring/assets/august-signature-authentic.png')
          output = Path('augustkring/assets/august-signature-smooth-4x.png')
          original = Image.open(source).convert('RGBA')

          if original.size != (260, 245):
              raise ValueError(f'Unexpected original signature dimensions: {original.size}')

          scale = 4
          alpha = original.getchannel('A')
          if alpha.getbbox() is None:
              raise ValueError('No visible ink in source signature')

          # Preserve original stroke geometry. No AI generation or SVG tracing.
          # Fourfold Lanczos resampling softens jagged pixel stair-steps;
          # fractional-pixel antialiasing removes quantised edge artifacts.
          resized_alpha = alpha.resize(
              (original.width * scale, original.height * scale),
              resample=Image.Resampling.LANCZOS,
          ).filter(ImageFilter.GaussianBlur(radius=0.35))

          enhanced = Image.new('RGBA', resized_alpha.size, (11, 34, 61, 0))
          enhanced.putalpha(resized_alpha)
          enhanced.save(output, format='PNG', optimize=True)

          if not (enhanced.getchannel('A').getbbox()):
              raise ValueError('Processed signature lost visible ink')
          if output.stat().st_size > 250_000:
              raise ValueError('Unexpectedly large signature output')
          print(f'Preserved the original signature in smooth RGBA at {enhanced.size}, {output.stat().st_size} bytes')
          PY

      - name: Commit new image asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add augustkring/assets/august-signature-smooth-4x.png
          if ! git diff --staged --quiet; then
            git commit -m "Add smoothed high-density PNG derived from original signature"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "Signature already up to date"
          fi
