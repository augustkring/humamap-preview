<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HumaMap — Governance + final CTA v42</title>
  <style>html,body{margin:0;background:#FCFCFA}</style>
</head>
<body>
  <iframe id="base" src="../top-v41/index.html" title="" style="position:fixed;inset:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('base');

      const styles = `
        /* Governance trust note */
        .governance-note{max-width:390px;margin-top:34px}
        .governance-note strong{display:block;color:var(--green);font-size:13.5px;line-height:1.35;font-weight:650;letter-spacing:-.01em}
        .governance-note p{margin:7px 0 0!important;color:var(--text)!important;font-size:14.5px!important;line-height:1.5!important;letter-spacing:-.003em!important}

        /* Leadership simplification */
        .lead40-programme-head{display:none!important}
        .lead40-programme{margin-top:42px!important}

        /* Final CTA */
        .final-cta-section{position:relative;overflow:hidden;padding-top:112px!important;padding-bottom:126px!important}
        .final-cta-inner{position:relative;z-index:1;max-width:980px;margin:0 auto;text-align:center}
        .final-cta-section::before,.final-cta-section::after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:0}
        .final-cta-section::before{left:50%;top:54%;width:760px;height:390px;transform:translate(-50%,-50%) rotate(-4deg);background:#F2F6F3}
        .final-cta-section::after{left:calc(50% - 335px);top:55px;width:150px;height:150px;background:#E1ECE5;box-shadow:570px 280px 0 #F7F9F7}
        .final-cta-inner h2{max-width:860px;margin:0 auto;font-size:54px;line-height:1.04;letter-spacing:-.04em;font-weight:550;text-wrap:balance}
        .final-cta-inner>p{max-width:560px;margin:25px auto 0;color:var(--muted);font-size:18px;line-height:1.55;letter-spacing:-.005em}
        .final-cta-actions{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:34px}
        .final-cta-primary{min-height:50px;display:inline-flex;align-items:center;justify-content:center;padding:0 24px;border-radius:8px;background:var(--text);color:#FAFAF7;text-decoration:none;font-size:15px;font-weight:600;letter-spacing:-.008em}
        .final-cta-secondary{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;font-size:15px;font-weight:600;letter-spacing:-.008em}
        .final-cta-micro{margin-top:12px!important;color:#858580!important;font-size:12.5px!important;line-height:1.4!important}

        @media(hover:hover){.final-cta-primary,.final-cta-secondary{transition:opacity .18s ease,color .18s ease}.final-cta-primary:hover{opacity:.9}.final-cta-secondary:hover{color:var(--green)}}
        @media(max-width:980px){
          .final-cta-section{padding-top:90px!important;padding-bottom:108px!important}
          .final-cta-inner h2{font-size:48px}
          .final-cta-section::before{width:650px;height:350px}
        }
        @media(max-width:680px){
          .governance-note{margin-top:28px}
          .lead40-programme{margin-top:34px!important}
          .final-cta-section{padding-top:76px!important;padding-bottom:88px!important}
          .final-cta-section::before{width:470px;height:330px}
          .final-cta-section::after{display:none}
          .final-cta-inner{text-align:left}
          .final-cta-inner h2{font-size:40px;text-align:left}
          .final-cta-inner>p{font-size:17px;margin-left:0}
          .final-cta-actions{flex-direction:column;align-items:stretch;gap:10px}
          .final-cta-primary{width:100%}
          .final-cta-secondary{justify-content:flex-start}
          .final-cta-micro{text-align:center}
        }
      `;

      const finalSection = `
        <section class="final-cta-section shell" aria-label="Create a HumaMap">
          <div class="final-cta-inner">
            <h2>Better work starts with better understanding of people.</h2>
            <p>Start with your company or start with yourself. Both are free.</p>
            <div class="final-cta-actions">
              <a class="final-cta-primary" href="#">Create your Company HumaMap</a>
              <a class="final-cta-secondary" href="#">Create your personal HumaMap →</a>
            </div>
            <p class="final-cta-micro">Free to use. Takes just a few minutes.</p>
          </div>
        </section>
      `;

      const render = () => {
        try {
          const doc = frame.contentDocument;
          const leadership = doc && doc.querySelector('.leadership-section');
          const decisionsCopy = doc && doc.querySelector('.decisions-copy');
          const main = doc && doc.querySelector('main');
          if (!doc || !leadership || !decisionsCopy || !main || !doc.querySelector('.lead40')) return false;

          const style = doc.createElement('style');
          style.textContent = styles;
          doc.head.appendChild(style);

          if (!decisionsCopy.querySelector('.governance-note')) {
            const governance = doc.createElement('div');
            governance.className = 'governance-note';
            governance.innerHTML = '<strong>Governance &amp; compliance</strong><p>European AI infrastructure, with HumaMap data hosted and processed in Europe. Built with privacy and organisational control in mind.</p>';
            decisionsCopy.appendChild(governance);
          }

          if (!main.querySelector('.final-cta-section')) {
            const holder = doc.createElement('div');
            holder.innerHTML = finalSection.trim();
            main.appendChild(holder.firstElementChild);
          }

          const clone = doc.documentElement.cloneNode(true);
          clone.querySelectorAll('script').forEach(script => script.remove());
          clone.querySelectorAll('#base').forEach(node => node.remove());

          document.open();
          document.write('<!doctype html>' + clone.outerHTML);
          document.close();
          return true;
        } catch (e) {
          return false;
        }
      };

      const timer = setInterval(() => {
        if (render()) clearInterval(timer);
      }, 120);
      setTimeout(() => clearInterval(timer), 12000);
    })();
  </script>
</body>
</html>
